[wizard.step.absgui]
title = "AbsGui（ウィンドウ付きアプリ）"
blurb = "AbsGui は、同じ設定に加えてシステム更新と追加のカーネルコンパイルツールを扱える、任意のクリック操作ウィンドウです。\n再インストールや ABS の更新時にも、この回答は記憶されます。"

[wizard.step.paths]
title = "ABS が使うフォルダ"
blurb = "これらはコンピュータ上のフォルダです。まだ存在しなければ ABS が作成します。\n$HOME（ホームフォルダ）を使えます。ホームフォルダ全体や /tmp のようなシステムフォルダを指定しないでください。\nコンピュータが複数ある場合は、完成パッケージ用フォルダを共有ドライブに置くと、コンパイルは 1 台だけで済みます。"

[wizard.step.build]
title = "ABS のコンパイル方法"
blurb = "これらのデフォルトはすべてのパッケージに適用されます。個別パッケージは、後から AbsGui または `abs --wizard` で変更できます。"

[wizard.step.cpu]
title = "ABS は CPU をどこまで使ってよいか"
blurb = "複数のパッケージを同時にコンパイルする場合、ABS は使用する CPU コアの合計を制限できるので、ほかの作業でもコンピュータを使い続けられます。"

[wizard.step.system_update]
title = "システムの残りの部分の更新"
blurb = "システムを更新またはアップグレードするよう ABS に依頼したとき（例: `abs -U`）に実行されるコマンドです。\n通常のコマンドを入力してください。パイプ（|）、&&、その他のシェル技は使えません。"

[wizard.step.repositories]
title = "ABS がビルド手順をダウンロードする場所"
blurb = "ここでのリポジトリは、ビルド手順（パッケージをコンパイルするための指示）がある git サイトです。\n複数を残したり、自分のものを追加したり、使わないものを削除したりできます。\nリポジトリを指定せずに `abs mesa` と入力したときは、選んだデフォルトを ABS が使います。"

[wizard.step.ramdisk]
title = "RAM 上でコンパイルしますか？（任意の高速化）"
blurb = "RAMディスクは、SSD ではなくメモリ上に置く一時ディスクです。そこでのコンパイルは多くの場合より速く、ディスクの消耗も減ります。\nただし空き RAM と、セットアップのためのパスワード（sudo）が必要です。前のステップのフォルダは、本物の永続的な場所のままです。\nRAMディスクはビルドが必要なときだけ作成され、ABS の起動時には作成されません。"

[wizard.step.self_update]
title = "ABS 自体を最新に保つ"
blurb = "ABS は GitHub で自身の新しいバージョンを確認できます。pacman でインストールする場合、ビルド済みパッケージは完成パッケージ用フォルダに入るので、ほかのコンピュータでも再利用できます。"

[wizard.step.package_lists]
title = "パッケージリスト（任意）"
blurb = "空のままでも構いません。Enter を押すと現在のリストを維持します（新規設定では空です）。\n名前をカンマまたはスペースで区切って入力します。「-」でリストをクリアします。\n後から `abs --wizard` または AbsGui で編集することもできます。"

[wizard.field.install_absgui]
title = "AbsGui（ウィンドウ付きアプリ）は必要ですか？"
explanation = "AbsGui は、同じ設定に加えてシステム更新と追加のカーネルコンパイルツールを扱える、クリック操作のウィンドウです。\n「はい」にすると、ABS が自身を更新するときも AbsGui を残します。「いいえ」はコマンドラインツールだけを残します。\n後から変更できます。"

[wizard.field.paths.packages_path]
title = "ダウンロードしたソースコードはどこに置きますか？"
explanation = "コンパイルの前に、ABS は各パッケージのソースファイルをこのフォルダへダウンロードします。\n例: mesa をビルドする場合、そのダウンロードはここに置かれます。\n完成したインストール用パッケージは別のフォルダへ入ります（次の質問）。"

[wizard.field.paths.chroot_base_path]
title = "隔離されたビルド環境はどこに置きますか？"
explanation = "後で「クリーンなミニシステム」を選ぶと、ABS は Linux の一時コピーの中でコンパイルするので、実際のインストールは触れられません。\nこのフォルダはその選択肢にだけ必要です。設定をあらかじめ用意するため、今のうちに尋ねています。"

[wizard.field.paths.ready_made_packages_path]
title = "完成したパッケージはどこに保存しますか？"
explanation = "コンパイルが成功すると、ABS はインストール可能なパッケージファイルをここに保存します。\n複数のコンピュータがこのフォルダを共有していれば、コンパイルは 1 台だけで済み、ほかはここからインストールできます。\npacman が自身のダウンロードパッケージを置くフォルダは使わないでください。"

[wizard.field.paths.chroot_makepkg_conf]
title = "隔離ビルド用のカスタムコンパイラ設定ファイル？（任意）"
explanation = "上級者向けです。隔離ビルド用の特別なコンパイラ設定ファイル（多くの場合 makepkg.conf）をすでに持っている場合だけです。\nそのようなファイルがなければ空のままにしてください。Enter で現在の値を維持し、「-」でクリアします。"

[wizard.field.build.default_environment]
title = "パッケージはどこでコンパイルしますか？"
explanation = "すべてのパッケージのデフォルトです。「このコンピュータ上」の方が簡単で速いです。「クリーンなミニシステム」はより隔離されますが、追加のディスク容量が必要です。"

[wizard.field.build.system_update_first]
title = "コンパイルの前にシステムを更新しますか？"
explanation = "「はい」は先にシステム更新を実行してからコンパイルします。ディスク上のライブラリと今ビルドしたものが食い違ってプログラムが壊れるのを防げます。ほとんどの人におすすめです。"

[wizard.field.build.ignore_compilation_failures]
title = "1 つのパッケージが失敗しても、ほかのコンパイルを続けますか？"
explanation = "「はい」は残りのパッケージを続行します。「いいえ」は全体を止めて、先に失敗を直せます。迷ったら「いいえ」の方が安全です。"

[wizard.field.build.compile_first_install_after]
title = "すべて先にコンパイルしてからインストールしますか？"
explanation = "「はい」はすべてのコンパイルを終えてからインストールを尋ねます。質問に答えずに一晩コンパイルさせたいときに便利です。「いいえ」はパッケージごとにインストールを尋ねることがあります。"

[wizard.field.build.clean_install_by_default]
title = "毎回クリーンなフォルダからコンパイルを始めますか？"
explanation = "「はい」はコンパイル前に残っている一時ビルドフォルダを削除するので、古いファイルが新しいビルドを混乱させません。少し遅くなります。「いいえ」は可能なときにそれらのフォルダを再利用します。"

[wizard.field.build.ignore_already_made_packages]
title = "パッケージファイルがすでに存在しても、常に再コンパイルしますか？"
explanation = "「いいえ」（推奨）は同じバージョンの完成パッケージを再利用し、コンパイルをスキップします。ほかのコンピュータがこのマシンでビルドしたパッケージを再利用すべきなら「いいえ」を選んでください。\n「はい」は常に再コンパイルします。後から `abs -n` で 1 回だけ強制的に再ビルドすることもできます。"

[wizard.field.build.concurrent_repos_downloads_limit]
title = "同時にダウンロードしてよいパッケージはいくつですか？"
explanation = "回線が良ければ、数を大きくするほどダウンロードが早く終わります。迷ったら推奨値から始めてください。"

[wizard.field.build.concurrent_compilations_limit]
title = "同時にコンパイルしてよいパッケージはいくつですか？"
explanation = "1 が最も安全で、メモリ使用量も少なくなります。CPU コアが多く RAM に余裕があるときだけ上げてください。大きなパッケージをいくつか同時にコンパイルすると、小さなコンピュータは固まることがあります。"

[wizard.field.build.clean_chroot_after_compilation]
title = "隔離コンパイルのあと、一時ミニシステムを削除しますか？"
explanation = "「はい」はクリーンなミニシステムでのコンパイル後にディスク容量を解放します。「いいえ」は残すので、次の隔離コンパイルは速くなることがありますが、ディスクをより使います。"

[wizard.field.build.fast_aur_rpc_update_checks]
title = "AUR の更新をまとめて確認しますか（より速い）？"
explanation = "AUR は Arch のユーザー投稿パッケージ集です。「はい」は各ダウンロードを個別に開く代わりに、多くのパッケージを AUR サイトへ一度に問い合わせます。より速く、おすすめです。"

[wizard.field.build.global_cpu_threads_mode]
title = "ABS は CPU 使用をどれだけ厳密に制限しますか？"
explanation = "これは複数のパッケージを同時にコンパイルするときだけ意味があります。\n「上限を絶対に超えない」はコンピュータの応答性を保ちます。もう一方はより速いですが、絶対的な最大値を設定できます。"

[wizard.field.build.default_compilation_threads]
title = "1 つのパッケージが使ってよい CPU コア数は？（任意）"
explanation = "1 つのパッケージが使ってよい CPU コア数です。空にするとビルドツールに任せます。保存済みの数値を消すには「-」と入力します。"

[wizard.field.build.global_cpu_threads_cap]
title = "すべてのコンパイル合計の最大 CPU コア数？（任意）"
explanation = "同時に動いているすべてのコンパイルが使うコア合計の上限です。コンピュータの残りを使い続けられます。追加の上限なしなら空のままにします。「-」でクリアします。"

[wizard.field.build.maximum_cpu_threads_cap]
title = "絶対的な最大 CPU コア数？（任意）"
explanation = "ソフト上限と組み合わせて使います。ABS が追加ジョブを始めても超えない絶対的な天井です。ソフト上限以上である必要があります。「-」でクリアします。"

[wizard.field.system_update.command_to_update_repositories]
title = "パッケージリストを更新するコマンドは？（まだアップグレードはしない）"
explanation = "利用可能なパッケージの最新リストをダウンロードするだけです。インストールもアップグレードもしません。典型例: sudo pacman -Sy"

[wizard.field.system_update.command_to_perform_system_update]
title = "システムの残りの部分をアップグレードするコマンドは？"
explanation = "利用可能な更新をインストールします。典型例: sudo pacman -Syu。普段 yay や paru を使っているなら、そのコマンドをここに入れてください。"

[wizard.field.system_update.command_to_perform_system_update_no_refresh]
title = "リストがすでに新しいときのアップグレードコマンドは？（任意）"
explanation = "上と同じアップグレードですが、リストは直前に更新済みなので再取得しません。典型例: sudo pacman -Su。「-」でクリアします。"

[wizard.field.system_update.ignore_flag]
title = "アップデーターはパッケージをどうスキップしますか？"
explanation = "ABS がシステムの残りの部分をアップグレードするとき、このオプションとパッケージ名を付けて、自分でコンパイルしたパッケージが事前ビルドの更新で置き換わらないようにします。pacman、yay、paru では --ignore です。"

[wizard.field.repositories]
title = "ABS はビルド手順をどこから取得しますか？"
explanation = "ABS がビルド手順をダウンロードしてよい git サイトと、名前を指定しないときに使うサイトを選びます。"

[wizard.field.ramdisk.enabled]
title = "コンパイルに RAMディスクを使いますか？"
explanation = "「はい」は大きなコンパイル（カーネルなど）を速くできることがあります。「いいえ」は単純で、追加の RAM も使いません。迷ったら「いいえ」を選んでください。"

[wizard.field.ramdisk.mount_point]
title = "RAMディスクはどこに現れますか？"
explanation = "例: /run/abs-ram。パスの最後の部分は「abs」で始まる必要があります。ABS が安全に見つけられるようにするためです。"

[wizard.field.ramdisk.size]
title = "使ってよい RAM の量は？"
explanation = "これは最大値であり、あらかじめ予約はしません。例: 16G または 50%。このコンピュータの RAM より大きくできません。カンマは使わないでください。"

[wizard.field.ramdisk.mode]
title = "RAMディスクのフォルダを使えるのは誰ですか？"
explanation = "これは権限コードです。0755 が普通の値です。あなたはフォルダの読み書きができ、ほかのユーザーは読むだけです。迷ったら推奨値のままにしてください。"

[wizard.field.ramdisk.build_workdir]
title = "重いコンパイル用フォルダを RAM に置きますか？"
explanation = "「はい」は一時コンパイルファイルとコンパイラキャッシュを RAM に置きます。カーネルのような大きなパッケージに向きます。空きメモリが必要です。"

[wizard.field.ramdisk.chroot]
title = "隔離ミニシステム全体を RAM に置きますか？"
explanation = "「はい」は隔離（クリーンなミニシステム）コンパイルを速くできますが、大量の RAM を使います。その方法でコンパイルし、メモリに十分な余裕がある場合だけです。"

[wizard.field.ramdisk.packages]
title = "ダウンロードしたソースをすべて RAM に置きますか？"
explanation = "「はい」はダウンロードしたソースフォルダをすべて RAM にコピーします。メモリを大量に使うので、十分な余裕がある場合だけです。"

[wizard.field.ramdisk.min_free_ram_mb]
title = "RAMディスクを使う前に必要な空き RAM（MB）は？"
explanation = "空きメモリがこれ（メガバイト）より少ないと、ABS は RAMディスクを使いません。マシンが固まるのを防ぐためです。4096 は 4 GB です。"

[wizard.field.check_for_update_on_startup]
title = "新しい ABS があるとき知らせますか？"
explanation = "「はい」は abs の起動時にバックグラウンドで確認し、更新があれば実行の最後に知らせます。それ自体は何もインストールしません。"

[wizard.field.auto_update_on_startup]
title = "起動時に ABS を自動更新しますか？"
explanation = "「はい」はほかの作業の前に新しい ABS をインストールします。時間がかかることがあります。「いいえ」は（前の質問を有効にしている場合）通知だけです。"

[wizard.field.self_update_use_pacman]
title = "ABS の更新を pacman でインストールしますか？"
explanation = "「はい」は普通の Arch のやり方です。パッケージをビルドし、pacman でインストールします。ファイルは完成パッケージ用フォルダに入ります。\n「いいえ」は abs（と AbsGui）のプログラムを、次で選ぶフォルダへコピーします。"

[wizard.field.self_update_install_path]
title = "abs プログラムはどこへコピーしますか？"
explanation = "AbsGui も同じフォルダに置かれます。典型例: /usr/bin/abs"

[wizard.field.self_update_at_updates]
title = "システム更新のときも新しい ABS を確認しますか？"
explanation = "「はい」はシステム更新（`abs -U`）のときに新しい ABS を探します。「いいえ」は（有効にしていれば）起動時だけ確認します。"

[wizard.field.manual_update_packages]
title = "ABS が監視し、新しくなったら再ビルドするパッケージは？"
explanation = "ABS はこれらのパッケージをリポジトリで確認し、新しいバージョンが出たら自動でコンパイルできます。例: mesa。まだよくわからなければ空のままにしてください。"

[wizard.field.skip_install_packages]
title = "公式リポジトリからインストールしてはいけないパッケージは？"
explanation = "自分でコンパイルする予定のパッケージは、通常、事前ビルド版を pacman に上書きインストールしてほしくありません。例: qemu*。* を使ったパターンも使えます。"

[wizard.field.skip_install_packages_after_compilation]
title = "自分でコンパイルしたあとインストールしてはいけないパッケージは？（任意）"
explanation = "コンパイル後、ABS は結果のインストールを提案することがあります。ここに挙げた名前はスキップされ、その手順が速くなります。\n例: qemu をコンパイルしてもドキュメントパッケージが不要なら qemu-docs。\nEnter で現在の値を維持します。「-」で空のリストにします。新規ファイルでは、Enter で未設定のままになります（上のリストと同じ）。"

[wizard.field.system_update.ignore_packages]
title = "システム更新時に追加でスキップするパッケージはありますか？"
explanation = "ABS がシステムアップグレードコマンドを実行するとき、上のリストに加えてこれらの名前がスキップリストに入ります。自分でコンパイルするものがほかのリストですでにカバーされていれば空のままにしてください。"

[wizard.choice.env.local]
label = "このコンピュータ上（簡単で速い）"
help = "ここにすでに入っているコンパイラとライブラリを使います。ほとんどの人がこれを望みます。"

[wizard.choice.env.chroot]
label = "クリーンなミニシステム内（より隔離）"
help = "ビルドは実際のインストールから余分なパッケージを取り込みません。\nより多くのディスク容量と、Arch の `devtools` パッケージが必要です。"

[wizard.choice.cpu.strict]
label = "上限を絶対に超えない"
help = "別のコンパイルが CPU コアを使いすぎる場合、ABS は待ちます。コンピュータの応答性が保たれます。"

[wizard.choice.cpu.flexible]
label = "ソフト上限、任意の絶対最大値つき"
help = "ABS はソフト上限を超えないよう努めますが、設定できる絶対最大値までは少し超えることがあります。"

