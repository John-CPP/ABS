[wizard.step.absgui]
title = "AbsGui (die Fenster-App)"
blurb = "AbsGui ist ein optionales, anklickbares Fenster für dieselben Einstellungen, plus Systemaktualisierungen und zusätzliche Kernel-Kompilierwerkzeuge.\nDeine Antwort wird gemerkt, wenn du ABS neu installierst oder aktualisierst."

[wizard.step.paths]
title = "Ordner, die ABS verwenden wird"
blurb = "Das sind Ordner auf deinem Rechner. ABS legt sie an, falls sie noch nicht existieren.\nDu kannst $HOME (dein Home-Verzeichnis) verwenden. Zeige nicht auf deinen gesamten Home-Ordner oder auf Systemordner wie /tmp.\nWenn du mehrere Rechner hast, lege den Ordner für fertige Pakete auf ein gemeinsames Laufwerk, damit nur ein PC kompilieren muss."

[wizard.step.build]
title = "Wie ABS kompiliert"
blurb = "Diese Standards gelten für jedes Paket. Du kannst ein einzelnes Paket später trotzdem in AbsGui oder mit `abs --wizard` ändern."

[wizard.step.cpu]
title = "Wie stark darf ABS die CPU belasten?"
blurb = "Wenn mehrere Pakete gleichzeitig kompilieren, kann ABS begrenzen, wie viele CPU-Kerne sie zusammen nutzen, damit der Rechner für andere Arbeit benutzbar bleibt."

[wizard.step.system_update]
title = "Den Rest des Systems aktualisieren"
blurb = "Das sind die Befehle, die ABS ausführt, wenn du das System aktualisieren oder upgraden lässt (zum Beispiel `abs -U`).\nGib einen normalen Befehl ein; keine Pipes (|), && oder andere Shell-Tricks."

[wizard.step.repositories]
title = "Wo ABS Bauanleitungen herunterlädt"
blurb = "Ein Repository hier ist eine Git-Website mit Bauanleitungen (den Anweisungen zum Kompilieren eines Pakets).\nDu kannst mehrere behalten, eigene hinzufügen oder ungenutzte entfernen.\nWenn du `abs mesa` ohne Repository eingibst, nutzt ABS den Standard, den du wählst."

[wizard.step.ramdisk]
title = "Im RAM kompilieren? (optionale Beschleunigung)"
blurb = "Eine RAM-Disk ist ein temporärer Datenträger im Arbeitsspeicher statt auf der SSD. Dort zu kompilieren ist oft schneller und schont das Laufwerk,\nbraucht aber freien RAM und dein Passwort (sudo) zum Einrichten. Die Ordner aus dem vorherigen Schritt bleiben die echten, dauerhaften Speicherorte.\nDie RAM-Disk wird nur angelegt, wenn ein Kompiliervorgang sie braucht, nicht beim Start von ABS."

[wizard.step.self_update]
title = "ABS selbst aktuell halten"
blurb = "ABS kann auf GitHub nach einer neueren Version von sich selbst suchen. Wenn du mit pacman installierst, landen die gebauten Pakete im Ordner für fertige Pakete, damit andere Rechner sie wiederverwenden können."

[wizard.step.package_lists]
title = "Paketlisten (optional)"
blurb = "Du kannst diese leer lassen. Mit Enter behältst du die aktuelle Liste (leer bei einer neuen Konfiguration).\nGib Namen ein, getrennt durch Kommas oder Leerzeichen. Mit '-' leerst du eine Liste.\nDu kannst sie später auch mit `abs --wizard` oder AbsGui bearbeiten."

[wizard.field.install_absgui]
title = "Möchtest du AbsGui (die Fenster-App)?"
explanation = "AbsGui ist ein anklickbares Fenster für dieselben Einstellungen, plus Systemaktualisierungen und zusätzliche Kernel-Kompilierwerkzeuge.\nJa behält AbsGui auch, wenn ABS sich selbst aktualisiert. Nein behält nur die Befehlszeilen-Werkzeuge.\nDu kannst das später ändern."

[wizard.field.paths.packages_path]
title = "Wohin sollen heruntergeladene Quelltexte gespeichert werden?"
explanation = "Vor dem Kompilieren lädt ABS die Quelldateien jedes Pakets in diesen Ordner.\nBeispiel: wenn du mesa baust, liegt dieser Download hier.\nFertige, installierbare Pakete landen in einem anderen Ordner (kommt als Nächstes)."

[wizard.field.paths.chroot_base_path]
title = "Wohin soll die isolierte Build-Umgebung gespeichert werden?"
explanation = "Wenn du später „sauberes Mini-System“ wählst, kompiliert ABS in einer temporären Linux-Kopie, damit deine echte Installation unberührt bleibt.\nDiesen Ordner brauchst du nur für diese Option. ABS fragt trotzdem jetzt, damit die Einstellung bereitliegt."

[wizard.field.paths.ready_made_packages_path]
title = "Wohin sollen fertige Pakete gespeichert werden?"
explanation = "Nach erfolgreichem Kompilieren legt ABS die installierbaren Paketdateien hier ab.\nWenn mehrere Rechner diesen Ordner teilen, muss nur einer kompilieren; die anderen können von hier installieren.\nVerwende nicht den Ordner, in dem pacman seine eigenen heruntergeladenen Pakete speichert."

[wizard.field.paths.chroot_makepkg_conf]
title = "Eigene Compiler-Einstellungsdatei für isolierte Builds? (optional)"
explanation = "Fortgeschritten. Nur wenn du bereits eine besondere Compiler-Einstellungsdatei (oft makepkg.conf) für isolierte Builds hast.\nLeer lassen, außer du hast so eine Datei schon. Mit Enter den aktuellen Wert behalten, oder '-' zum Leeren."

[wizard.field.build.default_environment]
title = "Wo sollen Pakete kompiliert werden?"
explanation = "Das ist der Standard für jedes Paket. „Auf diesem Rechner“ ist einfacher und schneller. „Sauberes Mini-System“ ist stärker isoliert, braucht aber extra Speicherplatz."

[wizard.field.build.system_update_first]
title = "Das System vor dem Kompilieren aktualisieren?"
explanation = "Ja führt zuerst eine Systemaktualisierung aus und kompiliert danach. Das vermeidet kaputte Programme, wenn eine lokal installierte Bibliothek nicht zu dem passt, was du gerade gebaut hast. Empfohlen für die meisten."

[wizard.field.build.ignore_compilation_failures]
title = "Wenn ein Paket fehlschlägt, die anderen weiter kompilieren?"
explanation = "Ja macht mit den restlichen Paketen weiter. Nein stoppt den ganzen Durchlauf, damit du den Fehler zuerst beheben kannst. Nein ist sicherer, wenn du unsicher bist."

[wizard.field.build.compile_first_install_after]
title = "Zuerst alles kompilieren, dann installieren?"
explanation = "Ja beendet alle Kompiliervorgänge und fragt dich dann nach der Installation. Praktisch, wenn der Rechner über Nacht kompilieren soll, ohne dass Fragen beantwortet werden müssen. Nein kann nach jedem Paket nach der Installation fragen."

[wizard.field.build.clean_install_by_default]
title = "Jeden Kompiliervorgang in einem sauberen Ordner starten?"
explanation = "Ja löscht übrig gebliebene temporäre Build-Ordner vor dem Kompilieren, damit alte Dateien einen neuen Kompiliervorgang nicht durcheinanderbringen. Etwas langsamer. Nein verwendet diese Ordner wieder, wenn möglich."

[wizard.field.build.ignore_already_made_packages]
title = "Immer neu kompilieren, auch wenn die Paketdatei schon existiert?"
explanation = "Nein (empfohlen) verwendet ein fertiges Paket derselben Version wieder und überspringt das Kompilieren. Wähle Nein, wenn andere Rechner auf dieser Maschine gebaute Pakete wiederverwenden sollen.\nJa kompiliert immer erneut. Ein einzelnes erneutes Kompilieren kannst du später trotzdem mit `abs -n` erzwingen."

[wizard.field.build.concurrent_repos_downloads_limit]
title = "Wie viele Pakete dürfen gleichzeitig heruntergeladen werden?"
explanation = "Höhere Zahlen machen Downloads bei guter Internetverbindung schneller fertig. Starte mit dem Vorschlag, wenn du unsicher bist."

[wizard.field.build.concurrent_compilations_limit]
title = "Wie viele Pakete dürfen gleichzeitig kompilieren?"
explanation = "1 ist am sichersten und braucht weniger Speicher. Erhöhe das nur, wenn du viele CPU-Kerne und genug RAM hast. Mehrere große Pakete gleichzeitig können einen kleinen Rechner einfrieren."

[wizard.field.build.clean_chroot_after_compilation]
title = "Das temporäre Mini-System nach einem isolierten Kompiliervorgang löschen?"
explanation = "Ja gibt nach dem Kompilieren in einem sauberen Mini-System Speicherplatz frei. Nein behält es, was den nächsten isolierten Kompiliervorgang beschleunigen kann, aber mehr Speicherplatz braucht."

[wizard.field.build.fast_aur_rpc_update_checks]
title = "AUR-Updates in einem Schwung prüfen (schneller)?"
explanation = "Das AUR ist die von Nutzern beigetragene Paketsammlung von Arch. Ja fragt die AUR-Website einmal für viele Pakete, statt jeden Download einzeln zu öffnen. Schneller und empfohlen."

[wizard.field.build.global_cpu_threads_mode]
title = "Wie streng soll ABS die CPU-Nutzung begrenzen?"
explanation = "Das spielt nur eine Rolle, wenn mehr als ein Paket gleichzeitig kompiliert.\n„Das Limit niemals überschreiten“ hält den Rechner reaktionsfähiger. Die andere Wahl ist schneller, aber du kannst ein hartes Maximum setzen."

[wizard.field.build.default_compilation_threads]
title = "Wie viele CPU-Kerne darf ein Paket nutzen? (optional)"
explanation = "Wie viele CPU-Kerne ein Paket nutzen darf. Leer lassen, damit das Build-Werkzeug entscheidet. '-' löscht eine gespeicherte Zahl."

[wizard.field.build.global_cpu_threads_cap]
title = "Maximale CPU-Kerne für alle Kompiliervorgänge zusammen? (optional)"
explanation = "Begrenzt die Gesamtzahl der Kerne aller gleichzeitig laufenden Kompiliervorgänge, damit der Rest des Rechners benutzbar bleibt. Leer lassen für keine zusätzliche Obergrenze. '-' zum Leeren."

[wizard.field.build.maximum_cpu_threads_cap]
title = "Absolutes Maximum an CPU-Kernen? (optional)"
explanation = "Nur bei einem weichen Limit verwendet. Das ist die harte Obergrenze, selbst wenn ABS extra Jobs startet. Sie muss mindestens so hoch sein wie das weiche Limit. '-' zum Leeren."

[wizard.field.system_update.command_to_update_repositories]
title = "Welcher Befehl aktualisiert die Paketliste (noch ohne Paketaktualisierungen)?"
explanation = "Das lädt nur die neueste Liste verfügbarer Pakete. Es wird nichts installiert oder aktualisiert. Typisch: sudo pacman -Sy"

[wizard.field.system_update.command_to_perform_system_update]
title = "Welcher Befehl aktualisiert den Rest des Systems?"
explanation = "Das installiert verfügbare Updates. Typisch: sudo pacman -Syu. Wenn du normalerweise yay oder paru nutzt, trag diesen Befehl stattdessen ein."

[wizard.field.system_update.command_to_perform_system_update_no_refresh]
title = "Welcher Aktualisierungsbefehl, wenn die Liste schon aktuell ist? (optional)"
explanation = "Dieselbe Aktualisierung wie oben, aber ohne die Liste zu aktualisieren, weil sie gerade erst aktualisiert wurde. Typisch: sudo pacman -Su. '-' zum Leeren."

[wizard.field.system_update.ignore_flag]
title = "Wie soll der Updater ein Paket überspringen?"
explanation = "Wenn ABS den Rest des Systems aktualisiert, hängt es diese Option plus Paketnamen an, damit deine selbst kompilierten Pakete nicht durch ein vorgebautes Update ersetzt werden. Für pacman, yay und paru ist das --ignore."

[wizard.field.repositories]
title = "Woher soll ABS Bauanleitungen holen?"
explanation = "Wähle, von welchen Git-Websites ABS Bauanleitungen herunterladen darf und welche genutzt wird, wenn du keine nennst."

[wizard.field.ramdisk.enabled]
title = "Eine RAM-Disk zum Kompilieren nutzen?"
explanation = "Ja kann große Kompiliervorgänge (wie den Kernel) beschleunigen. Nein ist einfacher und braucht keinen zusätzlichen RAM. Wenn du unsicher bist, wähle Nein."

[wizard.field.ramdisk.mount_point]
title = "Wo soll die RAM-Disk erscheinen?"
explanation = "Beispiel: /run/abs-ram. Der letzte Teil des Pfads muss mit „abs“ beginnen, damit ABS ihn sicher finden kann."

[wizard.field.ramdisk.size]
title = "Wie viel RAM darf sie nutzen?"
explanation = "Das ist ein Maximum, nichts wird im Voraus reserviert. Beispiele: 16G oder 50%. Es darf nicht größer sein als der Arbeitsspeicher dieses Rechners. Keine Kommas verwenden."

[wizard.field.ramdisk.mode]
title = "Wer darf den RAM-Disk-Ordner nutzen?"
explanation = "Das ist ein Berechtigungscode. 0755 ist der übliche Wert: du kannst den Ordner lesen und schreiben; andere Benutzer können ihn nur lesen. Behalte den Vorschlag, wenn du unsicher bist."

[wizard.field.ramdisk.build_workdir]
title = "Die rechenintensiven Kompilierordner in den RAM legen?"
explanation = "Ja speichert temporäre Kompilierdateien und Compiler-Caches im RAM. Gut für große Pakete wie den Kernel. Braucht freien Speicher."

[wizard.field.ramdisk.chroot]
title = "Das ganze isolierte Mini-System in den RAM legen?"
explanation = "Ja kann isolierte Kompiliervorgänge (sauberes Mini-System) beschleunigen, braucht aber viel RAM. Nur wenn du so kompilierst und genug Speicher hast."

[wizard.field.ramdisk.packages]
title = "Alle heruntergeladenen Quellen in den RAM legen?"
explanation = "Ja kopiert jeden heruntergeladenen Quellordner in den RAM. Braucht viel Speicher — nur wenn du genug übrig hast."

[wizard.field.ramdisk.min_free_ram_mb]
title = "Wie viel freier RAM (in MB) ist nötig, bevor die RAM-Disk genutzt wird?"
explanation = "Wenn der Rechner weniger freien Speicher hat als dieser Wert (in Megabyte), nutzt ABS die RAM-Disk nicht. Das hilft, ein Einfrieren der Maschine zu vermeiden. 4096 bedeutet 4 GB."

[wizard.field.check_for_update_on_startup]
title = "Bescheid geben, wenn eine neuere ABS-Version verfügbar ist?"
explanation = "Ja prüft im Hintergrund, wenn du abs startest, und erinnert dich am Ende des Durchlaufs, falls ein Update existiert. Es installiert von sich aus nichts."

[wizard.field.auto_update_on_startup]
title = "ABS beim Start automatisch aktualisieren?"
explanation = "Ja installiert eine neuere ABS, bevor sonst etwas passiert. Das kann eine Weile dauern. Nein benachrichtigt dich nur (wenn du die vorherige Frage aktiviert hast)."

[wizard.field.self_update_use_pacman]
title = "ABS-Updates mit pacman installieren?"
explanation = "Ja ist der übliche Arch-Weg: Pakete bauen und mit pacman installieren. Die Dateien landen im Ordner für fertige Pakete.\nNein kopiert die Programme abs (und AbsGui) in einen Ordner, den du als Nächstes wählst."

[wizard.field.self_update_install_path]
title = "Wohin soll das abs-Programm kopiert werden?"
explanation = "AbsGui wird in denselben Ordner gelegt. Typisch: /usr/bin/abs"

[wizard.field.self_update_at_updates]
title = "Auch während einer Systemaktualisierung nach einer neueren ABS suchen?"
explanation = "Ja sucht nach einer neueren ABS, wenn du eine Systemaktualisierung ausführst (`abs -U`). Nein prüft nur beim Start (falls du das aktiviert hast)."

[wizard.field.manual_update_packages]
title = "Welche Pakete soll ABS beobachten und bei neueren Versionen neu bauen?"
explanation = "ABS prüft diese Pakete in ihrem Repository und kann sie automatisch kompilieren, wenn eine neue Version erscheint. Beispiel: mesa. Leer lassen, wenn du noch unsicher bist."

[wizard.field.skip_install_packages]
title = "Welche Pakete sollen nicht aus den offiziellen Repos installiert werden?"
explanation = "Wenn du ein Paket selbst kompilieren willst, soll pacman in der Regel nicht die vorgebaute Version darüber installieren. Beispiel: qemu*. Muster mit * funktionieren."

[wizard.field.skip_install_packages_after_compilation]
title = "Welche Pakete sollen nach dem Kompilieren nicht installiert werden? (optional)"
explanation = "Nach dem Kompilieren kann ABS anbieten, das Ergebnis zu installieren. Hier gelistete Namen werden übersprungen, was diesen Schritt beschleunigt.\nBeispiel: qemu-docs, wenn du qemu kompiliert hast, aber das Dokumentationspaket nicht willst.\nMit Enter den aktuellen Wert behalten. '-' für eine leere Liste. Bei einer neuen Datei lässt Enter das ungesetzt (wie die Liste oben)."

[wizard.field.system_update.ignore_packages]
title = "Weitere Pakete, die bei einer Systemaktualisierung übersprungen werden sollen?"
