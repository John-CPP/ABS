pgo_reuse_afdo_profile = "若归档里已有合适的 AutoFDO 配置文件，则跳过 AutoFDO 采集。调试无 perf 基准仍会构建并启动调试内核。没有该项基准则跳过调试构建。"
pgo_reuse_propeller_profile = "若归档里已有合适的 Propeller 配置文件，则跳过 Propeller 采集。AutoFDO 无 perf 基准仍会构建并启动 AutoFDO 内核。没有该项基准则跳过 AutoFDO 构建。"
pgo_preset = "PGO 流水线预设名（通常为 cachyos-kernel）。为将来的流水线变体预留。"
pgo_profile_scratch = "分析期间存放 perf.data 的目录。auto = 若已启用则用内存盘，否则用 /tmp 或归档目录下的临时路径。"
pgo_perf_data_on_ram = "分析时将 perf.data 写到 tmpfs（内存盘配置文件暂存）；每阶段结束后复制到仓库/归档。"
pgo_propeller_profiles_on_ram = "将第 3 阶段的 propeller.data 和转换后的 propeller_cc/ld 配置文件留在内存盘上，不复制到 profiles_archive_dir。最终 Propeller 内核构建在同一次启动中完成，因此不需要 HDD 归档。取消勾选则会额外保存持久副本。"
