pgo_compare_debug = "重启后，在 perf record 下用该内核的 cachyos-benchmarker 收集 AutoFDO 配置文件。同一趟就是调试对比，不会再跑一遍。分数含有 perf 开销，会出现在 with-overhead 图集中。"
pgo_compare_debug_clean = "在收集 AutoFDO 之后，对调试内核再跑一次干净的 cachyos-benchmarker（无 perf record）。增加无开销序列。最终报告会生成两套图：with-overhead（若有收集日志）和 without-overhead。"
pgo_compare_autofdo = "重启后，在 perf record 下用该内核的 cachyos-benchmarker 收集 Propeller 配置文件。同一趟就是 AutoFDO 对比，不会再跑一遍。分数含有 perf 开销，会出现在 with-overhead 图集中。"
pgo_compare_autofdo_clean = "在收集 Propeller 之后，对 AutoFDO 内核再跑一次干净的 cachyos-benchmarker（无 perf record）。增加无开销序列。最终报告会生成两套图：with-overhead（若有收集日志）和 without-overhead。"
pgo_compare_final = "最后一次重启后对最终 Propeller 内核做干净的 cachyos-benchmarker 运行，并相对其他已选内核重新生成对比图。"
