[wizard.step.absgui]
title = "AbsGui（图形界面应用）"
blurb = "AbsGui 是可选的图形窗口，可管理相同设置，以及系统更新和额外的内核编译工具。\n重新安装或更新 ABS 时会记住你的选择。"

[wizard.step.paths]
title = "ABS 将使用的文件夹"
blurb = "这些是你电脑上的文件夹。若不存在，ABS 会自动创建。\n可以使用 $HOME（你的主目录）。请勿指向整个主目录，或 /tmp 这类系统目录。\n若有多台电脑，可将已完成软件包文件夹放在共享驱动器上，这样只需一台电脑编译。"

[wizard.step.build]
title = "ABS 如何编译"
blurb = "这些默认值适用于每个软件包。之后仍可在 AbsGui 或用 `abs --wizard` 为单个软件包更改。"

[wizard.step.cpu]
title = "ABS 可以使用多少 CPU？"
blurb = "若同时编译多个软件包，ABS 可限制它们合计使用的 CPU 核心数，以便电脑仍能做其他工作。"

[wizard.step.system_update]
title = "更新系统其余部分"
blurb = "这些是你让 ABS 刷新或升级系统时运行的命令（例如 `abs -U`）。\n请输入普通命令；不要使用管道（|）、&& 或其他 shell 技巧。"

[wizard.step.repositories]
title = "ABS 从何处下载构建配方"
blurb = "此处的仓库是含构建配方的 git 网站（编译软件包所用的说明）。\n可以保留多个、添加自己的，或移除不用的。\n输入 `abs mesa` 且未指定仓库时，ABS 使用你选择的默认仓库。"

[wizard.step.ramdisk]
title = "在内存中编译？（可选加速）"
blurb = "内存盘是位于内存而非 SSD 上的临时磁盘。在其中编译通常更快，也更少磨损磁盘，\n但需要空闲内存，并需输入密码（sudo）才能设置。前一步的文件夹仍是真正的永久位置。\n内存盘仅在某次构建需要时创建，不会在 ABS 启动时创建。"

[wizard.step.self_update]
title = "保持 ABS 自身为最新"
blurb = "ABS 可在 GitHub 上检查是否有更新版本。若用 pacman 安装，构建好的软件包会放入已完成软件包文件夹，供其他电脑复用。"

[wizard.step.package_lists]
title = "软件包列表（可选）"
blurb = "可以留空。按 Enter 保留当前列表（新配置时为空）。\n输入名称，用逗号或空格分隔。输入 '-' 可清空列表。\n之后也可用 `abs --wizard` 或 AbsGui 编辑。"

[wizard.field.install_absgui]
title = "要安装 AbsGui（图形界面应用）吗？"
explanation = "AbsGui 是可点击的图形窗口，可管理相同设置，以及系统更新和额外的内核编译工具。\n选「是」时，ABS 自我更新也会保留 AbsGui。选「否」则仅保留命令行工具。\n之后可以更改。"

[wizard.field.paths.packages_path]
title = "下载的源代码应存放在哪里？"
explanation = "编译前，ABS 会将每个软件包的源文件下载到此文件夹。\n例如：若构建 mesa，下载内容会放在这里。\n已完成的可安装软件包放在另一个文件夹（下一题询问）。"

[wizard.field.paths.chroot_base_path]
title = "隔离构建环境应存放在哪里？"
explanation = "若之后选择「干净的迷你系统」，ABS 会在临时的 Linux 副本中编译，以免改动真实系统。\n仅在使用该选项时需要此文件夹。现在询问是为了提前准备好设置。"

[wizard.field.paths.ready_made_packages_path]
title = "已完成的软件包应保存在哪里？"
explanation = "编译成功后，ABS 将可安装的软件包文件存放于此。\n若多台电脑共享此文件夹，只需一台编译，其他电脑可从此处安装。\n请勿使用 pacman 存放其自身下载软件包的文件夹。"

[wizard.field.paths.chroot_makepkg_conf]
title = "隔离构建的自定义编译器设置文件？（可选）"
explanation = "高级选项。仅当你已有用于隔离构建的特殊编译器设置文件（通常名为 makepkg.conf）时才需要。\n没有此类文件请留空。按 Enter 保留当前值，或输入 '-' 清空。"

[wizard.field.build.default_environment]
title = "软件包应在何处编译？"
explanation = "这是每个软件包的默认值。「在本机」更简单更快。「干净的迷你系统」隔离更好，但需要额外磁盘空间。"

[wizard.field.build.system_update_first]
title = "编译前先更新系统吗？"
explanation = "选「是」会先更新系统再编译。可避免磁盘上的库与刚构建的内容不匹配而导致程序损坏。建议大多数人启用。"

[wizard.field.build.ignore_compilation_failures]
title = "若某个软件包失败，是否继续编译其余的？"
explanation = "选「是」会继续编译其余软件包。选「否」会停止整次运行，以便先修复失败。不确定时选「否」更安全。"

[wizard.field.build.compile_first_install_after]
title = "先全部编译完再安装？"
explanation = "选「是」会完成所有编译后再询问是否安装。适合让电脑通宵编译而无需回答问题。选「否」可能在每个软件包后询问是否安装。"

[wizard.field.build.clean_install_by_default]
title = "每次编译都从干净文件夹开始？"
explanation = "选「是」会在编译前删除残留的临时构建文件夹，避免旧文件干扰新构建。会稍慢一些。选「否」会尽可能复用这些文件夹。"

[wizard.field.build.ignore_already_made_packages]
title = "即使软件包文件已存在，也始终重新编译？"
explanation = "选「否」（推荐）会复用同版本的已完成软件包并跳过编译。若其他电脑应复用本机构建的软件包，请选「否」。\n选「是」则始终重新编译。之后仍可用 `abs -n` 强制重建一次。"

[wizard.field.build.concurrent_repos_downloads_limit]
title = "最多同时下载多少个软件包？"
explanation = "网速较好时，数字越大下载越快。不确定时请使用建议值。"

[wizard.field.build.concurrent_compilations_limit]
title = "最多同时编译多少个软件包？"
explanation = "1 最安全，占用内存也更少。仅在 CPU 核心多且内存充足时再提高。同时编译多个大型软件包可能导致小内存电脑卡死。"

[wizard.field.build.clean_chroot_after_compilation]
title = "隔离编译后删除临时迷你系统？"
explanation = "选「是」会在干净迷你系统中编译后释放磁盘空间。选「否」会保留它，可加快下次隔离编译，但占用更多磁盘。"

[wizard.field.build.fast_aur_rpc_update_checks]
title = "批量检查 AUR 更新（更快）？"
explanation = "AUR 是 Arch 的用户贡献软件包集合。选「是」会一次向 AUR 网站查询多个软件包，而不是分别打开每次下载。更快，推荐使用。"

[wizard.field.build.global_cpu_threads_mode]
title = "ABS 应多严格地限制 CPU 使用？"
explanation = "仅在同时编译多个软件包时才有意义。\n「永不超出限制」能让电脑更流畅。另一选项更快，但你可以设置硬性上限。"

[wizard.field.build.default_compilation_threads]
title = "单个软件包最多使用多少 CPU 核心？（可选）"
explanation = "单个软件包可使用的 CPU 核心数。留空则由构建工具决定。输入 '-' 可清除已保存的数字。"

[wizard.field.build.global_cpu_threads_cap]
title = "所有编译合计最多使用多少 CPU 核心？（可选）"
explanation = "限制同时运行的所有编译合计使用的核心数，以便电脑其余部分仍可使用。留空表示不加额外上限。输入 '-' 可清除。"

[wizard.field.build.maximum_cpu_threads_cap]
title = "CPU 核心的绝对上限？（可选）"
explanation = "仅在使用软限制时生效。这是硬性上限，即使 ABS 启动额外任务也不会超出。必须至少等于软上限。输入 '-' 可清除。"

[wizard.field.system_update.command_to_update_repositories]
title = "用什么命令刷新软件包列表（暂不升级）？"
explanation = "这只会下载最新的可用软件包列表，不会安装或升级任何内容。通常为：sudo pacman -Sy"

[wizard.field.system_update.command_to_perform_system_update]
title = "用什么命令升级系统其余部分？"
explanation = "这会安装可用的更新。通常为：sudo pacman -Syu。若平时使用 yay 或 paru，请改为相应命令。"

[wizard.field.system_update.command_to_perform_system_update_no_refresh]
title = "列表已是最新时使用什么升级命令？（可选）"
explanation = "与上面相同的升级，但跳过刷新列表（因为刚刷新过）。通常为：sudo pacman -Su。输入 '-' 可清除。"

[wizard.field.system_update.ignore_flag]
title = "更新程序应如何跳过某个软件包？"
explanation = "ABS 升级系统其余部分时，会加上此选项和软件包名称，以免你自行编译的软件包被预构建更新替换。对 pacman、yay 和 paru 而言，此选项为 --ignore。"

[wizard.field.repositories]
title = "ABS 应从何处获取构建配方？"
explanation = "选择 ABS 可从哪些 git 网站下载构建配方，以及未指定时使用哪一个。"

[wizard.field.ramdisk.enabled]
title = "使用内存盘进行编译？"
explanation = "选「是」可加快大型编译（如内核）。选「否」更简单，也不占用额外内存。不确定时请选「否」。"

[wizard.field.ramdisk.mount_point]
title = "内存盘应出现在何处？"
explanation = "例如：/run/abs-ram。路径的最后一部分必须以 “abs” 开头，以便 ABS 能安全找到它。"

[wizard.field.ramdisk.size]
title = "最多可使用多少内存？"
explanation = "这是上限，并非预先预留。例如：16G 或 50%。不能大于本机内存。请勿使用逗号。"

[wizard.field.ramdisk.mode]
title = "谁可以使用内存盘文件夹？"
explanation = "这是权限代码。0755 是常用值：你可以读写该文件夹；其他用户只能读取。不确定时请保留建议值。"

[wizard.field.ramdisk.build_workdir]
title = "将占用较大的编译文件夹放入内存？"
explanation = "选「是」会将临时编译文件和编译器缓存存入内存。适合内核等大型软件包。需要空闲内存。"

[wizard.field.ramdisk.chroot]
title = "将整个隔离迷你系统放入内存？"
explanation = "选「是」可加快隔离（干净迷你系统）编译，但会占用大量内存。仅在你采用该编译方式且内存充足时使用。"

[wizard.field.ramdisk.packages]
title = "将所有下载的源码放入内存？"
explanation = "选「是」会将每个下载的源码文件夹复制到内存。占用大量内存 — 仅在内存非常充裕时使用。"

[wizard.field.ramdisk.min_free_ram_mb]
title = "使用内存盘前需要多少空闲内存（MB）？"
explanation = "若电脑空闲内存少于此值（以兆字节计），ABS 不会使用内存盘。这有助于避免机器卡死。4096 表示 4 GB。"

[wizard.field.check_for_update_on_startup]
title = "有新版本 ABS 时通知你？"
explanation = "选「是」会在启动 abs 时在后台检查，若有更新则在本次运行结束时提醒你。它不会自行安装任何内容。"

[wizard.field.auto_update_on_startup]
title = "启动时自动更新 ABS？"
explanation = "选「是」会在做其他事前先安装新版本 ABS。可能需要一段时间。选「否」则仅通知你（若已启用上一题）。"

[wizard.field.self_update_use_pacman]
title = "用 pacman 安装 ABS 更新？"
explanation = "选「是」是常见的 Arch 方式：构建软件包并用 pacman 安装。文件会放入已完成软件包文件夹。\n选「否」会将 abs（和 AbsGui）程序复制到下一题选择的文件夹。"

[wizard.field.self_update_install_path]
title = "abs 程序应复制到何处？"
explanation = "AbsGui 会放在同一文件夹。通常为：/usr/bin/abs"

[wizard.field.self_update_at_updates]
title = "系统更新时也检查新版本 ABS？"
explanation = "选「是」会在运行系统更新（`abs -U`）时查找新版本 ABS。选「否」则仅在启动时检查（若已启用该项）。"

[wizard.field.manual_update_packages]
title = "ABS 应监视并在有新版本时重建哪些软件包？"
explanation = "ABS 会在仓库中检查这些软件包，并在出现新版本时可自动编译。例如：mesa。不确定时可留空。"

[wizard.field.skip_install_packages]
title = "哪些软件包不应从官方仓库安装？"
explanation = "若打算自行编译某个软件包，通常不希望 pacman 用预构建版本覆盖它。例如：qemu*。带 * 的模式有效。"

[wizard.field.skip_install_packages_after_compilation]
title = "编译完成后哪些软件包不应安装？（可选）"
explanation = "编译后，ABS 可能会询问是否安装结果。此处列出的名称会被跳过，从而加快该步骤。\n例如：若编译了 qemu 但不想安装文档包，可填 qemu-docs。\n按 Enter 保留当前值。输入 '-' 表示空列表。新文件中按 Enter 表示未设置（与上面的列表相同）。"

[wizard.field.system_update.ignore_packages]
title = "系统更新时还有哪些额外软件包要跳过？"
explanation = "ABS 运行系统升级命令时，这些名称会加到跳过列表中，叠加在上面的列表之上。若其他列表已覆盖你自行编译的软件包，可留空。"

[wizard.choice.env.local]
label = "在本机（更简单更快）"
help = "使用本机已安装的编译器和库。这是大多数人的选择。"

[wizard.choice.env.chroot]
label = "在干净的迷你系统中（隔离更好）"
help = "构建不会从真实系统中带入额外软件包。\n需要更多磁盘空间以及名为 `devtools` 的 Arch 软件包。"

[wizard.choice.cpu.strict]
label = "永不超出限制"
help = "若再启动一次编译会使用过多 CPU 核心，ABS 会等待。电脑会更流畅。"

[wizard.choice.cpu.flexible]
label = "软限制，可设硬性上限"
help = "ABS 尽量不超过软限制，但可能略微超出，直至你设置的硬性上限。"

