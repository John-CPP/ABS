[wizard.step.absgui]
title = "AbsGui (التطبيق ذو النوافذ)"
blurb = "AbsGui نافذة اختيارية قابلة للنقر لنفس الإعدادات، بالإضافة إلى تحديثات النظام وأدوات إضافية لتجميع النواة.\nتُحفظ إجابتك عند إعادة تثبيت ABS أو تحديثه."

[wizard.step.paths]
title = "المجلدات التي سيستخدمها ABS"
blurb = "هذه مجلدات على حاسوبك. يُنشئها ABS إن لم تكن موجودة بعد.\nيمكنك استخدام $HOME (مجلدك الشخصي). لا توجّه هذه إلى مجلدك الشخصي بالكامل أو إلى مجلدات النظام مثل /tmp.\nإن كان لديك عدة حواسيب، ضع مجلد الحزم الجاهزة على محرك مشترك حتى لا يضطر سوى جهاز واحد للتجميع."

[wizard.step.build]
title = "كيف يُجمّع ABS"
blurb = "تنطبق هذه الافتراضيات على كل حزمة. يمكنك تغيير حزمة واحدة لاحقاً في AbsGui أو باستخدام `abs --wizard`."

[wizard.step.cpu]
title = "إلى أي حد يجوز لـ ABS أن يضغط على المعالج؟"
blurb = "إذا جُمّعت عدة حزم في آن واحد، يمكن لـ ABS أن يحدّ عدد أنوية المعالج التي تستخدمها معاً حتى يبقى الحاسوب قابلاً للاستخدام لأعمال أخرى."

[wizard.step.system_update]
title = "تحديث بقية نظامك"
blurb = "هذه الأوامر التي يشغّلها ABS عندما تطلب منه تحديث النظام أو ترقيته (مثلاً `abs -U`).\nاكتب أمراً عادياً؛ بلا أنابيب (|)، ولا &&، ولا حيل صدفة إضافية."

[wizard.step.repositories]
title = "من أين ينزّل ABS وصفات البناء"
blurb = "المستودع هنا هو موقع git يحتوي وصفات بناء (التعليمات المستخدمة لتجميع حزمة).\nيمكنك الإبقاء على عدة مستودعات، أو إضافة مستودعك، أو إزالة ما لا تستخدمه.\nعندما تكتب `abs mesa` دون تسمية مستودع، يستخدم ABS الافتراضي الذي تختاره."

[wizard.step.ramdisk]
title = "التجميع في RAM؟ (تسريع اختياري)"
blurb = "قرص RAM هو قرص مؤقت يعيش في الذاكرة بدل القرص SSD. التجميع هناك غالباً أسرع ويُرهق القرص أقل،\nلكنه يحتاج ذاكرة RAM حرة وكلمة مرورك (sudo) للإعداد. المجلدات من الخطوة السابقة تبقى المواقع الحقيقية الدائمة.\nيُنشأ قرص RAM فقط عندما يحتاج بناء إليه، وليس عند بدء ABS."

[wizard.step.self_update]
title = "إبقاء ABS نفسه محدَّثاً"
blurb = "يمكن لـ ABS أن يتحقق من GitHub بحثاً عن إصدار أحدث منه. إذا ثبّتّ باستخدام pacman، تذهب الحزم المبنية إلى مجلد الحزم الجاهزة حتى تتمكن الحواسيب الأخرى من إعادة استخدامها."

[wizard.step.package_lists]
title = "قوائم الحزم (اختياري)"
blurb = "يمكنك ترك هذه فارغة. اضغط Enter للإبقاء على القائمة الحالية (فارغة في إعداد جديد).\nاكتب الأسماء مفصولة بفواصل أو مسافات. اكتب '-' لمسح قائمة.\nيمكنك أيضاً تعديلها لاحقاً باستخدام `abs --wizard` أو AbsGui."

[wizard.field.install_absgui]
title = "هل تريد AbsGui (التطبيق ذا النوافذ)؟"
explanation = "AbsGui نافذة قابلة للنقر لنفس الإعدادات، بالإضافة إلى تحديثات النظام وأدوات إضافية لتجميع النواة.\nنعم يُبقي AbsGui أيضاً عندما يحدّث ABS نفسه. لا: يُبقي أدوات سطر الأوامر فقط.\nيمكنك تغيير هذا لاحقاً."

[wizard.field.paths.packages_path]
title = "أين يجب أن تُحفظ الشيفرة المصدرية المُنزَّلة؟"
explanation = "قبل التجميع، ينزّل ABS ملفات المصدر لكل حزمة إلى هذا المجلد.\nمثال: إذا بنيت mesa، يعيش ذلك التنزيل هنا.\nالحزم الجاهزة القابلة للتثبيت تذهب إلى مجلد مختلف (يُسأل عنه تالياً)."

[wizard.field.paths.chroot_base_path]
title = "أين يجب أن تكون بيئة البناء المعزولة؟"
explanation = "إذا اخترت لاحقاً «نظام مصغّر نظيف»، يُجمّع ABS داخل نسخة مؤقتة من Linux حتى يبقى تثبيتك الحقيقي دون مساس.\nتحتاج هذا المجلد لذلك الخيار فقط. يسأل ABS الآن حتى يكون الإعداد جاهزاً."

[wizard.field.paths.ready_made_packages_path]
title = "أين يجب حفظ الحزم الجاهزة؟"
explanation = "بعد تجميع ناجح، يخزّن ABS ملفات الحزم القابلة للتثبيت هنا.\nإذا شاركت عدة حواسيب هذا المجلد، يكفي أن يُجمّع جهاز واحد؛ ويمكن للبقية التثبيت من هنا.\nلا تستخدم المجلد الذي يخزّن فيه pacman حزمه المُنزَّلة الخاصة."

[wizard.field.paths.chroot_makepkg_conf]
title = "ملف إعدادات مُجمِّع مخصص للبناء المعزول؟ (اختياري)"
explanation = "متقدم. فقط إذا كان لديك مسبقاً ملف إعدادات مُجمِّع خاص (غالباً باسم makepkg.conf) للبناء المعزول.\nاتركه فارغاً ما لم يكن لديك مثل هذا الملف. اضغط Enter للإبقاء على القيمة الحالية، أو اكتب '-' للمسح."

[wizard.field.build.default_environment]
title = "أين يجب تجميع الحزم؟"
explanation = "هذا هو الافتراضي لكل حزمة. «على هذا الحاسوب» أبسط وأسرع. «نظام مصغّر نظيف» أكثر عزلاً لكنه يحتاج مساحة قرص إضافية."

[wizard.field.build.system_update_first]
title = "تحديث النظام قبل التجميع؟"
explanation = "نعم يشغّل تحديثاً للنظام أولاً، ثم يُجمّع. ذلك يتجنّب برامج معطّلة عندما لا تطابق مكتبة على القرص ما بنيته للتو. موصى به لمعظم الناس."

[wizard.field.build.ignore_compilation_failures]
title = "إذا فشلت حزمة واحدة، هل نواصل تجميع البقية؟"
explanation = "نعم يواصل مع الحزم المتبقية. لا: يوقف التشغيل بالكامل حتى تصلح الفشل أولاً. اختيار لا أكثر أماناً إن لم تكن متأكداً."

[wizard.field.build.compile_first_install_after]
title = "تجميع كل شيء أولاً، ثم التثبيت؟"
explanation = "نعم يُنهي كل التجميعات، ثم يطلب منك التثبيت. مفيد إن أردت ترك الحاسوب يُجمّع طوال الليل دون الإجابة على أسئلة. لا: قد يطلب منك التثبيت بعد كل حزمة."

[wizard.field.build.clean_install_by_default]
title = "بدء كل تجميع من مجلد نظيف؟"
explanation = "نعم يحذف مجلدات البناء المؤقتة المتبقية قبل التجميع، حتى لا تربك الملفات القديمة بناءً جديداً. أبطأ قليلاً. لا: يعيد استخدام تلك المجلدات عند الإمكان."

[wizard.field.build.ignore_already_made_packages]
title = "إعادة التجميع دائماً، حتى إن وُجد ملف حزمة مسبقاً؟"
explanation = "لا (موصى به) يعيد استخدام حزمة جاهزة من الإصدار نفسه ويتخطى التجميع. اختر لا إن كان على الحواسيب الأخرى إعادة استخدام الحزم المبنية على هذا الجهاز.\nنعم يُجمّع دائماً من جديد. يمكنك فرض إعادة بناء واحدة لاحقاً باستخدام `abs -n`."

[wizard.field.build.concurrent_repos_downloads_limit]
title = "كم حزمة يجوز تنزيلها في آن واحد؟"
explanation = "الأرقام الأعلى تُنهي التنزيلات أسرع على اتصال إنترنت جيد. ابدأ بالاقتراح إن لم تكن متأكداً."

[wizard.field.build.concurrent_compilations_limit]
title = "كم حزمة يجوز تجميعها في آن واحد؟"
explanation = "1 هو الأكثر أماناً ويستهلك ذاكرة أقل. ارفع هذا فقط إن كان لديك أنوية معالج كثيرة وRAM وفيرة. تجميع عدة حزم كبيرة معاً قد يجمّد حاسوباً صغيراً."

[wizard.field.build.clean_chroot_after_compilation]
title = "حذف النظام المصغّر المؤقت بعد تجميع معزول؟"
explanation = "نعم يحرّر مساحة القرص بعد التجميع في نظام مصغّر نظيف. لا: يُبقيه، ما قد يسرّع التجميع المعزول التالي لكنه يستخدم مساحة قرص أكبر."

[wizard.field.build.fast_aur_rpc_update_checks]
title = "التحقق من تحديثات AUR دفعة واحدة (أسرع)؟"
explanation = "AUR مجموعة حزم يساهم بها مستخدمو Arch. نعم يسأل موقع AUR مرة واحدة عن حزم كثيرة بدل فتح كل تنزيل على حدة. أسرع وموصى به."

[wizard.field.build.global_cpu_threads_mode]
title = "إلى أي حد يجب أن يقيّد ABS استخدام المعالج؟"
explanation = "هذا يهم فقط عندما تُجمَّع أكثر من حزمة في الوقت نفسه.\n«لا تتجاوز الحد أبداً» يُبقي الحاسوب أكثر استجابة. الخيار الآخر أسرع لكن يمكنك تعيين حد أقصى صارم."

[wizard.field.build.default_compilation_threads]
title = "كم نواة معالج يجوز لحزمة واحدة استخدامها؟ (اختياري)"
explanation = "عدد أنوية المعالج التي يجوز لحزمة واحدة استخدامها. اتركه فارغاً ليقرّر أداة البناء. اكتب '-' لمسح رقم محفوظ."

[wizard.field.build.global_cpu_threads_cap]
title = "الحد الأقصى لأنوية المعالج لكل التجميعات معاً؟ (اختياري)"
explanation = "يضع سقفاً لمجموع الأنوية التي تستخدمها كل التجميعات الجارية معاً، حتى يبقى بقية الحاسوب قابلاً للاستخدام. اتركه فارغاً بلا سقف إضافي. اكتب '-' للمسح."

[wizard.field.build.maximum_cpu_threads_cap]
title = "الحد الأقصى المطلق لأنوية المعالج؟ (اختياري)"
explanation = "يُستخدم فقط مع حد مرن. هذا هو السقف الصارم، حتى إن بدأ ABS مهاماً إضافية. يجب أن يكون على الأقل بمقدار السقف المرن. اكتب '-' للمسح."

[wizard.field.system_update.command_to_update_repositories]
title = "ما الأمر الذي يحدّث قائمة الحزم (دون ترقية بعد)؟"
explanation = "هذا ينزّل أحدث قائمة بالحزم المتاحة فقط. لا يثبّت ولا يرقّي شيئاً. المعتاد: sudo pacman -Sy"

[wizard.field.system_update.command_to_perform_system_update]
title = "ما الأمر الذي يرقّي بقية النظام؟"
explanation = "هذا يثبّت التحديثات المتاحة. المعتاد: sudo pacman -Syu. إذا كنت تستخدم عادةً yay أو paru، ضع ذلك الأمر هنا بدلاً منه."

[wizard.field.system_update.command_to_perform_system_update_no_refresh]
title = "ما أمر الترقية عند كون القائمة محدَّثة أصلاً؟ (اختياري)"
explanation = "نفس الترقية أعلاه، لكن تخطَّ تحديث القائمة لأنها حُدّثت للتو. المعتاد: sudo pacman -Su. اكتب '-' للمسح."

[wizard.field.system_update.ignore_flag]
title = "كيف يتخطى المحدِّث حزمة؟"
explanation = "عندما يرقّي ABS بقية النظام، يضيف هذا الخيار مع أسماء الحزم حتى لا تُستبدل حزمك المُجمَّعة بتحديث جاهز مسبقاً. لـ pacman وyay وparu هذا هو --ignore."

[wizard.field.repositories]
title = "من أين يحصل ABS على وصفات البناء؟"
explanation = "اختر مواقع git التي يجوز لـ ABS تنزيل وصفات البناء منها، وأيّها يُستخدم عندما لا تسمّي واحداً."

[wizard.field.ramdisk.enabled]
title = "استخدام قرص RAM للتجميع؟"
explanation = "نعم قد يجعل التجميعات الكبيرة (مثل النواة) أسرع. لا: أبسط ولا يستهلك RAM إضافية. إن لم تكن متأكداً، اختر لا."

[wizard.field.ramdisk.mount_point]
title = "أين يجب أن يظهر قرص RAM؟"
explanation = "مثال: /run/abs-ram. يجب أن يبدأ الجزء الأخير من المسار بـ «abs» حتى يتمكن ABS من العثور عليه بأمان."

[wizard.field.ramdisk.size]
title = "كم من RAM يجوز له استخدامه؟"
explanation = "هذا حد أقصى، وليس محجوزاً مسبقاً. أمثلة: 16G أو 50%. لا يمكن أن يكون أكبر من RAM هذا الجهاز. لا تستخدم فواصل."

[wizard.field.ramdisk.mode]
title = "من يجوز له استخدام مجلد قرص RAM؟"
explanation = "هذا رمز صلاحيات. 0755 هي القيمة المعتادة: يمكنك قراءة المجلد والكتابة فيه؛ المستخدمون الآخرون يمكنهم قراءته فقط. اترك الاقتراح إن لم تكن متأكداً."

[wizard.field.ramdisk.build_workdir]
title = "وضع مجلدات التجميع الثقيلة في RAM؟"
explanation = "نعم يخزّن ملفات التجميع المؤقتة وذاكرة التخزين المؤقت للمُجمِّع في RAM. جيد للحزم الكبيرة مثل النواة. يحتاج ذاكرة حرة."

[wizard.field.ramdisk.chroot]
title = "وضع النظام المصغّر المعزول بالكامل في RAM؟"
explanation = "نعم قد يجعل التجميعات المعزولة (نظام مصغّر نظيف) أسرع لكنه يستخدم الكثير من RAM. فقط إن كنت تُجمّع بهذه الطريقة ولديك ذاكرة وفيرة."

[wizard.field.ramdisk.packages]
title = "وضع كل المصادر المُنزَّلة في RAM؟"
explanation = "نعم ينسخ كل مجلد مصدر مُنزَّل إلى RAM. يستخدم الكثير من الذاكرة — فقط إن كان لديك فائض وافر."

[wizard.field.ramdisk.min_free_ram_mb]
title = "كم من RAM الحرة (بالميغابايت) مطلوبة قبل استخدام قرص RAM؟"
explanation = "إذا كان للحاسوب ذاكرة حرة أقل من هذا (بالميغابايت)، فلن يستخدم ABS قرص RAM. ذلك يساعد على تجنّب تجميد الجهاز. 4096 تعني 4 GB."

[wizard.field.check_for_update_on_startup]
title = "إخبارك عند توفر إصدار أحدث من ABS؟"
explanation = "نعم يتحقق في الخلفية عند تشغيل abs، ويذكّرك في نهاية التشغيل إن وُجد تحديث. لا يثبّت شيئاً من تلقاء نفسه."

[wizard.field.auto_update_on_startup]
title = "تحديث ABS تلقائياً عند البدء؟"
explanation = "نعم يثبّت إصداراً أحدث من ABS قبل فعل أي شيء آخر. قد يستغرق ذلك وقتاً. لا: يكتفي بإشعارك (إن فعّلت السؤال السابق)."

[wizard.field.self_update_use_pacman]
title = "تثبيت تحديثات ABS باستخدام pacman؟"
explanation = "نعم هي الطريقة المعتادة في Arch: بناء الحزم وتثبيتها باستخدام pacman. تذهب الملفات إلى مجلد الحزم الجاهزة.\nلا: تُنسَخ برامج abs (وAbsGui) إلى مجلد تختاره تالياً."

[wizard.field.self_update_install_path]
title = "أين يجب نسخ برنامج abs؟"
explanation = "يُوضع AbsGui في المجلد نفسه. المعتاد: /usr/bin/abs"

[wizard.field.self_update_at_updates]
title = "التحقق أيضاً من إصدار أحدث من ABS أثناء تحديث النظام؟"
explanation = "نعم يبحث عن إصدار أحدث من ABS عندما تشغّل تحديث نظام (`abs -U`). لا: يتحقق عند البدء فقط (إن فعّلت ذلك)."

[wizard.field.manual_update_packages]
title = "أي حزم يجب أن يراقبها ABS ويعيد بناءها عندما تصبح أحدث؟"
explanation = "يتحقق ABS من هذه الحزم في مستودعها ويمكنه تجميعها تلقائياً عند ظهور إصدار جديد. مثال: mesa. اتركه فارغاً إن لم تكن متأكداً بعد."

[wizard.field.skip_install_packages]
title = "أي حزم يجب ألا تُثبَّت من المستودعات الرسمية؟"
explanation = "إذا كنت تخطط لتجميع حزمة بنفسك، فعادة لا تريد أن يثبّت pacman النسخة الجاهزة فوقها. مثال: qemu*. الأنماط التي تحتوي * تعمل."

[wizard.field.skip_install_packages_after_compilation]
title = "أي حزم يجب ألا تُثبَّت بعد تجميعها؟ (اختياري)"
explanation = "بعد التجميع، قد يعرض ABS تثبيت النتيجة. الأسماء المدرجة هنا تُتخطى، ما يسرّع تلك الخطوة.\nمثال: qemu-docs إذا جمّعت qemu لكنك لا تريد حزمة التوثيق.\nاضغط Enter للإبقاء على القيمة الحالية. اكتب '-' لقائمة فارغة. في ملف جديد، Enter يترك هذا غير معيَّن (نفس القائمة أعلاه)."

[wizard.field.system_update.ignore_packages]
title = "أي حزم إضافية يُتخطى أثناء تحديث النظام؟"
explanation = "تُضاف هذه الأسماء إلى قائمة التخطي عندما يشغّل ABS أمر ترقية النظام، فوق القوائم أعلاه. اتركه فارغاً إن كانت القوائم الأخرى تغطي ما تُجمّعه بنفسك."

[wizard.choice.env.local]
label = "على هذا الحاسوب (أبسط وأسرع)"
help = "يستخدم المُجمِّعات والمكتبات المثبَّتة هنا أصلاً. هذا ما يريده معظم الناس."

[wizard.choice.env.chroot]
label = "في نظام مصغّر نظيف (أكثر عزلاً)"
help = "لا يمكن للبناء التقاط حزم إضافية من تثبيتك الحقيقي.\nيحتاج مساحة قرص أكبر وحزمة Arch المسماة `devtools`."

[wizard.choice.cpu.strict]
label = "لا تتجاوز الحد أبداً"
help = "إذا كان تجميع آخر سيستخدم أنوية معالج أكثر مما ينبغي، ينتظر ABS. يبقى الحاسوب أكثر استجابة."

[wizard.choice.cpu.flexible]
label = "حد مرن، مع حد أقصى صارم اختياري"
help = "يحاول ABS البقاء تحت حد مرن، لكن قد يتجاوز قليلاً حتى حد أقصى صارم يمكنك تعيينه."

