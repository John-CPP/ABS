[gui.help]
cpusched = "Variante del planificador del kernel que se pasa como _cpusched al PKGBUILD de CachyOS (p. ej. bore, eevdf, rt)."
processor_opt = "Nivel de microarquitectura de CPU para -march (native o x86-64-v2/v3/v4). Corresponde a _processor_opt."
llvm_lto = "Compilador/LTO (_use_llvm_lto): none = compilación GCC, thin/full = Clang con LTO. Aplica a compilaciones únicas; PGO impone su valor por etapa."
hz_ticks = "Frecuencia de interrupción del temporizador en Hz (_HZ_ticks). Afecta latencia frente a consumo."
tickrate = "Comportamiento tickless: full (siempre sin ticks), idle o periodic. Corresponde a _tickrate."
preempt = "Modelo de expropiación del kernel (full, voluntary, server, lazy). Corresponde a _preempt."
hugepage = "Política de hugepages transparentes: always o madvise. Corresponde a _hugepage."
cc_harder = "Activa KBUILD_CFLAGS -O3 con _cc_harder. El valor CachyOS por defecto es sí. Desmarca para -O2."
lto_suffix = "Añade -lto al nombre del paquete (_use_lto_suffix). Solo compilaciones únicas; las etapas PGO gestionan los sufijos."
gcc_suffix = "Añade -gcc al nombre del paquete al compilar con GCC (_use_gcc_suffix)."
kcfi = "Activa Control Flow Integrity del kernel (_use_kcfi). Requiere una compilación Clang/LLVM."
source = "Repositorio de origen del PKGBUILD en [repositories]: aur, arch, cachyos o un nombre de repo personalizado."
build_env = "Entorno de compilación: local (makepkg del anfitrión) o chroot (rootfs aislado)."
package_alias = "Nombre alternativo del paquete upstream para comprobar actualizaciones (p. ej. el paquete del repo que sigue este paquete AUR)."
package_compiler = "Conjunto de compilador de [compilers] para este paquete; vacío = default_compiler / valor de makepkg."
package_tests = "Ejecuta la fase check() del PKGBUILD. El valor por defecto sigue a makepkg; false pasa --nocheck."
package_upstream_github = "GitHub owner/repo (o URL) comprobado con -R/-RU cuando el PKGBUILD se queda detrás de las versiones upstream."
package_upstream_prereleases = "También tener en cuenta las prereleases de GitHub al elegir la versión upstream más nueva."
package_pre_update_cmd = "Comando de shell que se ejecuta antes de compilar este paquete (p. ej. detener un servicio)."
package_post_update_cmd = "Comando de shell que se ejecuta después de instalar este paquete (p. ej. reiniciar un servicio)."
package_custom_local_cmd = "Sustituye la invocación de makepkg en compilaciones locales. Se ejecuta en el directorio del paquete; vacío = makepkg por defecto."
package_custom_chroot_cmd = "Sustituye la invocación de makechrootpkg en compilaciones chroot. Se ejecuta en el directorio del paquete; vacío = valor por defecto."
ramdisk_targets = "Coloca partes de la compilación en tmpfs (ramdisk). Las letras se combinan en el valor ramdisk= de abs.toml."
ramdisk_w = "Directorio de trabajo (src/, pkg/) en tmpfs: acelera la E/S de compilación en árboles grandes como el kernel."
ramdisk_c = "Sistema de archivos raíz del chroot en tmpfs: instalaciones más rápidas dentro del chroot."
ramdisk_p = "Clon git / extracción bajo packages_path en tmpfs. Usa mucha RAM; actívalo solo si te sobra memoria."
ramdisk_r = "Espacio temporal de perfiles PGO (perf.data) en tmpfs; los perfiles se copian a profiles_archive_dir tras cada etapa."
kernel_ramdisk_targets = "Opciones de ramdisk para kernel/PGO. El PKGBUILD y los tarballs de fuentes se quedan en disco salvo que actives repo-en-ramdisk (p)."
kernel_ramdisk_w = "Compilar en ramdisk: el repo git y las descargas se quedan en disco; src/ y pkg/ (árbol extraído) usan tmpfs. También redirige ccache, TMPDIR y otras cachés de compilación al ramdisk."
kernel_ramdisk_p = "Repo en ramdisk: clona el árbol git completo en tmpfs (se vuelve a descargar en cada etapa PGO; no recomendado)."
kernel_ramdisk_r = "Escribe perf.data en tmpfs durante el perfilado; las descargas de cachyos-benchmarker se cachean en disco bajo profiles_archive_dir/benchmark-workdir."
kernel_ramdisk_hint = "Recomendado: solo w + r (compilar y el temporal de perfiles en tmpfs; el repo git y los tarballs del kernel se quedan en disco). La etapa 1 ejecuta updpkgsums una vez antes de copiar al ramdisk."
pgo_benchmark_workdir = "Caché persistente opcional para las descargas de cachyos-benchmarker. Valor por defecto: {profiles_archive_dir}/benchmark-workdir."
pgo_enabled = "Con abs --pgo ejecuta la canalización AutoFDO + Propeller en varias etapas en lugar de una sola compilación."
pgo_archive_dir = "Obligatorio. Directorio donde se guardan archivos de perfiles PGO y artefactos intermedios entre etapas y reinicios."
pgo_benchmark = "Opcional. Sustituye el script de perfilado de ABS. Déjalo vacío para usar el incluido (se actualiza en cada ejecución)."
pgo_benchmark_preset = "Carga de perfilado cuando la calidad es standard: fast = sysbench + stress-ng; cachyos = cachyos-benchmarker completo. Maximum siempre usa cachyos."
pgo_profiling_quality = "standard = muestreo equilibrado (-c 56000) y tu preset de benchmark. maximum (por defecto) = muestreo más denso (-c 48000) + cachyos-benchmarker completo para perfiles de calidad llvm-profgen."
pgo_build_user = "Usuario Unix que ejecuta las cargas de perfilado tras el reinicio (debe coincidir con el usuario de tu script de benchmark)."
pgo_sysctl = "Comando que se invoca antes del perfilado para ajustar sysctl (p. ej. cachyos-perf-sysctl)."
pgo_auto_restart = "abs reinicia en cada etapa de espera PGO y reanuda tras el arranque con una unidad systemd de usuario hasta terminar. absgui pasa --pgo-auto; hace falta linger o un inicio gráfico para systemd de usuario."
pgo_preset = "Nombre del preset de la canalización PGO (normalmente cachyos-kernel). Reservado para variantes futuras."
pgo_profile_scratch = "Directorio para perf.data durante el perfilado. auto = ramdisk si está activo; si no, una ruta temporal bajo /tmp o el directorio de archivo."
pgo_perf_data_on_ram = "Escribe perf.data en tmpfs (temporal de perfiles en ramdisk) durante el perfilado; se copia al repo/archivo tras cada etapa."
pgo_verify_boot = "Tras las etapas de espera con reinicio, comprobar que uname -r coincide con el kernel esperado antes de seguir."
pgo_perf_event_args = "Argumentos de eventos de perf record. auto = detectar eventos de rama Zen (--pfm-events) o Intel (BR_INST_RETIRED.NEAR_TAKEN) desde gcc -march=native."
pgo_perf_extra_args = "Flags de perf record tras los eventos (mmap-pages, -a, -N, -b, -c). profiling_quality sustituye -c salvo que pongas un valor propio aquí."
pgo_vmlinux = "Ruta al vmlinux DWARF para llvm-profgen. auto = /usr/src/debug/<pkgbase>/vmlinux del paquete -dbg instalado."
pgo_afdo_tool = "Herramienta de conversión de perfiles para la etapa 2 (por defecto llvm-profgen)."
pgo_propeller_tool = "Herramienta de conversión de perfiles para la etapa 3. auto (por defecto) usa generate_propeller_profiles si está en PATH; si no, create_llvm_prof. Los kernels LLVM 22+ necesitan generate_propeller_profiles (google/llvm-propeller); create_llvm_prof 0.30 no puede leer BB_ADDR_MAP v5."
pgo_afdo_profile_name = "Nombre del archivo de perfil AutoFDO copiado al árbol de fuentes del kernel (por defecto kernel-compilation.afdo)."
