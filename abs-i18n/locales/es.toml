[wizard.step.absgui]
title = "AbsGui (la aplicación con ventana)"
blurb = "AbsGui es una ventana opcional con clics para la misma configuración, además de actualizaciones del sistema y herramientas extra para compilar el kernel.\nTu respuesta se recuerda al reinstalar o actualizar ABS."

[wizard.step.paths]
title = "Carpetas que usará ABS"
blurb = "Estas son carpetas de tu equipo. ABS las crea si aún no existen.\nPuedes usar $HOME (tu carpeta de usuario). No las apuntes a toda tu carpeta de usuario ni a carpetas del sistema como /tmp.\nSi tienes varios equipos, pon la carpeta de paquetes terminados en una unidad compartida para que solo un PC tenga que compilar."

[wizard.step.build]
title = "Cómo compila ABS"
blurb = "Estos valores predeterminados se aplican a todos los paquetes. Aún puedes cambiar un paquete más adelante en AbsGui o con `abs --wizard`."

[wizard.step.cpu]
title = "¿Hasta dónde puede ABS cargar la CPU?"
blurb = "Si se compilan varios paquetes a la vez, ABS puede limitar cuántos núcleos de CPU usan en conjunto para que el equipo siga siendo usable para otras tareas."

[wizard.step.system_update]
title = "Actualizar el resto del sistema"
blurb = "Estos son los comandos que ABS ejecuta cuando le pides que refresque o actualice el sistema (por ejemplo `abs -U`).\nEscribe un comando normal; sin tuberías (|), && ni otros trucos de shell."

[wizard.step.repositories]
title = "De dónde descarga ABS las recetas de compilación"
blurb = "Un repositorio aquí es un sitio git con recetas de compilación (las instrucciones usadas para compilar un paquete).\nPuedes conservar varios, añadir los tuyos o quitar los que no uses.\nCuando escribes `abs mesa` sin nombrar un repositorio, ABS usa el predeterminado que elijas."

[wizard.step.ramdisk]
title = "¿Compilar en RAM? (aceleración opcional)"
blurb = "Un disco RAM es un disco temporal que vive en la memoria en lugar de en tu SSD. Compilar ahí suele ser más rápido y desgasta menos el disco,\npero necesita RAM libre y tu contraseña (sudo) para configurarlo. Las carpetas del paso anterior siguen siendo las ubicaciones reales y permanentes.\nEl disco RAM se crea solo cuando una compilación lo necesita, no al iniciar ABS."

[wizard.step.self_update]
title = "Mantener ABS al día"
blurb = "ABS puede consultar GitHub en busca de una versión más reciente de sí mismo. Si instalas con pacman, los paquetes compilados van a la carpeta de paquetes terminados para que otros equipos puedan reutilizarlos."

[wizard.step.package_lists]
title = "Listas de paquetes (opcional)"
blurb = "Puedes dejarlas vacías. Pulsa Intro para conservar la lista actual (vacía en una configuración nueva).\nEscribe nombres separados por comas o espacios. Escribe '-' para borrar una lista.\nTambién puedes editarlas más adelante con `abs --wizard` o AbsGui."

[wizard.field.install_absgui]
title = "¿Quieres AbsGui (la aplicación con ventana)?"
explanation = "AbsGui es una ventana con clics para la misma configuración, además de actualizaciones del sistema y herramientas extra para compilar el kernel.\nSí también conserva AbsGui cuando ABS se actualiza a sí mismo. No deja solo las herramientas de línea de comandos.\nPuedes cambiar esto más adelante."

[wizard.field.paths.packages_path]
title = "¿Dónde debe vivir el código fuente descargado?"
explanation = "Antes de compilar, ABS descarga los archivos fuente de cada paquete en esta carpeta.\nEjemplo: si compilas mesa, esa descarga vive aquí.\nLos paquetes instalables terminados van a otra carpeta (se pregunta a continuación)."

[wizard.field.paths.chroot_base_path]
title = "¿Dónde debe vivir el entorno de compilación aislado?"
explanation = "Si más adelante eliges “mini-sistema limpio”, ABS compila dentro de una copia temporal de Linux para que tu instalación real no se toque.\nSolo necesitas esta carpeta para esa opción. ABS pregunta ahora para que el ajuste esté listo."

[wizard.field.paths.ready_made_packages_path]
title = "¿Dónde deben guardarse los paquetes terminados?"
explanation = "Tras una compilación correcta, ABS guarda aquí los archivos de paquete instalables.\nSi varios equipos comparten esta carpeta, solo uno necesita compilar; los demás pueden instalar desde aquí.\nNo uses la carpeta donde pacman guarda sus propios paquetes descargados."

[wizard.field.paths.chroot_makepkg_conf]
title = "¿Archivo de configuración del compilador personalizado para compilaciones aisladas? (opcional)"
explanation = "Avanzado. Solo si ya tienes un archivo especial de configuración del compilador (a menudo llamado makepkg.conf) para compilaciones aisladas.\nDéjalo vacío a menos que ya tengas ese archivo. Pulsa Intro para conservar el valor actual, o escribe '-' para borrar."

[wizard.field.build.default_environment]
title = "¿Dónde deben compilarse los paquetes?"
explanation = "Este es el valor predeterminado para todos los paquetes. “En este equipo” es más simple y rápido. “Mini-sistema limpio” está más aislado pero necesita más espacio en disco."

[wizard.field.build.system_update_first]
title = "¿Actualizar el sistema antes de compilar?"
explanation = "Sí ejecuta primero una actualización del sistema y luego compila. Así se evitan programas rotos cuando una biblioteca en disco no coincide con lo que acabas de compilar. Recomendado para la mayoría de la gente."

[wizard.field.build.ignore_compilation_failures]
title = "Si un paquete falla, ¿seguir compilando los demás?"
explanation = "Sí continúa con los paquetes restantes. No detiene toda la ejecución para que puedas corregir el fallo primero. No es más seguro si no estás seguro."

[wizard.field.build.compile_first_install_after]
title = "¿Compilar todo primero y luego instalar?"
explanation = "Sí termina todas las compilaciones y luego te pide instalar. Útil si quieres dejar el equipo compilando por la noche sin responder preguntas. No puede pedirte instalar después de cada paquete."

[wizard.field.build.clean_install_by_default]
title = "¿Empezar cada compilación desde una carpeta limpia?"
explanation = "Sí elimina las carpetas temporales de compilación sobrantes antes de compilar, para que archivos antiguos no confundan una compilación nueva. Un poco más lento. No reutiliza esas carpetas cuando es posible."

[wizard.field.build.ignore_already_made_packages]
title = "¿Recompilar siempre, aunque el archivo del paquete ya exista?"
explanation = "No (recomendado) reutiliza un paquete terminado de la misma versión y omite la compilación. Elige No si otros equipos deben reutilizar paquetes compilados en esta máquina.\nSí siempre vuelve a compilar. Aún puedes forzar una recompilación más adelante con `abs -n`."

[wizard.field.build.concurrent_repos_downloads_limit]
title = "¿Cuántos paquetes pueden descargarse a la vez?"
explanation = "Números más altos terminan las descargas más rápido con una buena conexión a internet. Empieza con la sugerencia si no estás seguro."

[wizard.field.build.concurrent_compilations_limit]
title = "¿Cuántos paquetes pueden compilarse a la vez?"
explanation = "1 es lo más seguro y usa menos memoria. Súbelo solo si tienes muchos núcleos de CPU y bastante RAM. Compilar varios paquetes grandes a la vez puede congelar un equipo pequeño."

[wizard.field.build.clean_chroot_after_compilation]
title = "¿Eliminar el mini-sistema temporal después de una compilación aislada?"
explanation = "Sí libera espacio en disco después de compilar en un mini-sistema limpio. No lo conserva, lo que puede acelerar la siguiente compilación aislada pero usa más disco."

[wizard.field.build.fast_aur_rpc_update_checks]
title = "¿Comprobar actualizaciones del AUR en un solo lote (más rápido)?"
explanation = "El AUR es la colección de paquetes aportados por usuarios de Arch. Sí consulta el sitio del AUR una vez para muchos paquetes en lugar de abrir cada descarga por separado. Más rápido y recomendado."

[wizard.field.build.global_cpu_threads_mode]
title = "¿Con qué rigor debe ABS limitar el uso de CPU?"
explanation = "Esto solo importa cuando se compila más de un paquete al mismo tiempo.\n“Nunca superar el límite” mantiene el equipo más receptivo. La otra opción es más rápida, pero puedes fijar un máximo estricto."

[wizard.field.build.default_compilation_threads]
title = "¿Cuántos núcleos de CPU puede usar un paquete? (opcional)"
explanation = "Cuántos núcleos de CPU puede usar un paquete. Déjalo vacío para que decida la herramienta de compilación. Escribe '-' para borrar un número guardado."

[wizard.field.build.global_cpu_threads_cap]
title = "¿Máximo de núcleos de CPU para todas las compilaciones juntas? (opcional)"
explanation = "Limita el total de núcleos usados por todas las compilaciones en curso, para que el resto del equipo siga siendo usable. Déjalo vacío para no añadir un tope extra. Escribe '-' para borrar."

[wizard.field.build.maximum_cpu_threads_cap]
title = "¿Máximo absoluto de núcleos de CPU? (opcional)"
explanation = "Solo se usa con un límite suave. Este es el techo estricto, aunque ABS inicie trabajos extra. Debe ser al menos tan alto como el tope suave. Escribe '-' para borrar."

[wizard.field.system_update.command_to_update_repositories]
title = "¿Qué comando actualiza la lista de paquetes (aún sin actualizar nada)?"
explanation = "Esto solo descarga la lista más reciente de paquetes disponibles. No instala ni actualiza nada. Típico: sudo pacman -Sy"

[wizard.field.system_update.command_to_perform_system_update]
title = "¿Qué comando actualiza el resto del sistema?"
explanation = "Esto instala las actualizaciones disponibles. Típico: sudo pacman -Syu. Si normalmente usas yay o paru, pon ese comando aquí."

[wizard.field.system_update.command_to_perform_system_update_no_refresh]
title = "¿Qué comando de actualización usar cuando la lista ya está fresca? (opcional)"
explanation = "La misma actualización de arriba, pero sin refrescar la lista porque acaba de refrescarse. Típico: sudo pacman -Su. Escribe '-' para borrar."

[wizard.field.system_update.ignore_flag]
title = "¿Cómo debe el actualizador omitir un paquete?"
explanation = "Cuando ABS actualiza el resto del sistema, añade esta opción más los nombres de paquetes para que tus paquetes compilados no sean reemplazados por una actualización precompilada. Para pacman, yay y paru esto es --ignore."

[wizard.field.repositories]
title = "¿De dónde debe obtener ABS las recetas de compilación?"
explanation = "Elige de qué sitios git puede ABS descargar recetas de compilación, y cuál usar cuando no nombras uno."

[wizard.field.ramdisk.enabled]
title = "¿Usar un disco RAM para compilar?"
explanation = "Sí puede hacer más rápidas las compilaciones grandes (como el kernel). No es más simple y no usa RAM extra. Si no estás seguro, elige No."

[wizard.field.ramdisk.mount_point]
title = "¿Dónde debe aparecer el disco RAM?"
explanation = "Ejemplo: /run/abs-ram. La última parte de la ruta debe empezar por “abs” para que ABS pueda encontrarlo de forma segura."

[wizard.field.ramdisk.size]
title = "¿Cuánta RAM puede usar?"
explanation = "Esto es un máximo, no se reserva de antemano. Ejemplos: 16G o 50%. No puede ser mayor que la RAM de este equipo. No uses comas."

[wizard.field.ramdisk.mode]
title = "¿Quién puede usar la carpeta del disco RAM?"
explanation = "Esto es un código de permisos. 0755 es el valor habitual: tú puedes leer y escribir la carpeta; los demás usuarios solo pueden leerla. Deja la sugerencia si no estás seguro."

[wizard.field.ramdisk.build_workdir]
title = "¿Poner las carpetas pesadas de compilación en RAM?"
explanation = "Sí guarda los archivos temporales de compilación y las cachés del compilador en RAM. Bueno para paquetes grandes como el kernel. Necesita memoria libre."

[wizard.field.ramdisk.chroot]
title = "¿Poner todo el mini-sistema aislado en RAM?"
explanation = "Sí puede acelerar las compilaciones aisladas (mini-sistema limpio) pero usa mucha RAM. Solo si compilas de esa forma y tienes memoria de sobra."

[wizard.field.ramdisk.packages]
title = "¿Poner todas las fuentes descargadas en RAM?"
explanation = "Sí copia cada carpeta de fuentes descargadas a la RAM. Usa mucha memoria — solo si te sobra."

[wizard.field.ramdisk.min_free_ram_mb]
title = "¿Cuánta RAM libre (en MB) se requiere antes de usar el disco RAM?"
explanation = "Si el equipo tiene menos memoria libre que esto (en megabytes), ABS no usará el disco RAM. Así se evita congelar la máquina. 4096 significa 4 GB."

[wizard.field.check_for_update_on_startup]
title = "¿Avisarte cuando hay un ABS más reciente?"
explanation = "Sí comprueba en segundo plano al iniciar abs y te lo recuerda al final de la ejecución si hay una actualización. No instala nada por sí mismo."

[wizard.field.auto_update_on_startup]
title = "¿Actualizar ABS automáticamente al iniciar?"
explanation = "Sí instala un ABS más reciente antes de hacer cualquier otra cosa. Eso puede tardar. No solo te notifica (si activaste la pregunta anterior)."

[wizard.field.self_update_use_pacman]
title = "¿Instalar las actualizaciones de ABS con pacman?"
explanation = "Sí es la forma habitual en Arch: compilar paquetes e instalarlos con pacman. Los archivos van a la carpeta de paquetes terminados.\nNo copia los programas abs (y AbsGui) a una carpeta que eliges a continuación."

[wizard.field.self_update_install_path]
title = "¿Dónde debe copiarse el programa abs?"
explanation = "AbsGui se coloca en la misma carpeta. Típico: /usr/bin/abs"

[wizard.field.self_update_at_updates]
title = "¿Comprobar también un ABS más reciente durante una actualización del sistema?"
explanation = "Sí busca un ABS más reciente cuando ejecutas una actualización del sistema (`abs -U`). No solo comprueba al iniciar (si activaste eso)."

[wizard.field.manual_update_packages]
title = "¿Qué paquetes debe vigilar ABS y recompilar cuando haya uno más reciente?"
explanation = "ABS comprueba estos paquetes en su repositorio y puede compilarlos automáticamente cuando aparece una versión nueva. Ejemplo: mesa. Déjalo vacío si aún no estás seguro."

[wizard.field.skip_install_packages]
title = "¿Qué paquetes no deben instalarse desde los repositorios oficiales?"
explanation = "Si planeas compilar un paquete tú mismo, normalmente no quieres que pacman instale encima la versión precompilada. Ejemplo: qemu*. Los patrones con * funcionan."

[wizard.field.skip_install_packages_after_compilation]
title = "¿Qué paquetes no deben instalarse después de haberlos compilado? (opcional)"
explanation = "Tras compilar, ABS puede ofrecer instalar el resultado. Los nombres de esta lista se omiten, lo que acelera ese paso.\nEjemplo: qemu-docs si compilaste qemu pero no quieres el paquete de documentación.\nPulsa Intro para conservar el valor actual. Escribe '-' para una lista vacía. En un archivo nuevo, Intro deja esto sin definir (igual que la lista de arriba)."

[wizard.field.system_update.ignore_packages]
title = "¿Algún paquete extra que omitir durante una actualización del sistema?"
explanation = "Estos nombres se añaden a la lista de omisión cuando ABS ejecuta tu comando de actualización del sistema, además de las listas de arriba. Déjalo vacío si las otras listas ya cubren lo que compilas tú mismo."

[wizard.choice.env.local]
label = "En este equipo (más simple y rápido)"
help = "Usa los compiladores y bibliotecas ya instalados aquí. Esto es lo que quiere la mayoría de la gente."

[wizard.choice.env.chroot]
label = "En un mini-sistema limpio (más aislado)"
help = "La compilación no puede tomar paquetes extra de tu instalación real.\nNecesita más espacio en disco y el paquete de Arch llamado `devtools`."

[wizard.choice.cpu.strict]
label = "Nunca superar el límite"
help = "Si otra compilación usaría demasiados núcleos de CPU, ABS espera. El equipo se mantiene más receptivo."

[wizard.choice.cpu.flexible]
label = "Límite suave, con un máximo estricto opcional"
