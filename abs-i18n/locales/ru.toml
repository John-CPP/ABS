[wizard.step.absgui]
title = "AbsGui (оконное приложение)"
blurb = "AbsGui — необязательное окно с кнопками для тех же настроек, плюс обновления системы и дополнительные инструменты компиляции ядра.\nВаш ответ запоминается при переустановке или обновлении ABS."

[wizard.step.paths]
title = "Папки, которые будет использовать ABS"
blurb = "Это папки на вашем компьютере. ABS создаёт их, если их ещё нет.\nМожно использовать $HOME (ваша домашняя папка). Не указывайте на всю домашнюю папку или на системные папки вроде /tmp.\nЕсли у вас несколько компьютеров, поместите папку готовых пакетов на общий диск, чтобы компилировать пришлось только одному ПК."

[wizard.step.build]
title = "Как ABS компилирует"
blurb = "Эти значения по умолчанию применяются к каждому пакету. Один пакет всё равно можно изменить позже в AbsGui или командой `abs --wizard`."

[wizard.step.cpu]
title = "Насколько сильно ABS может нагружать процессор?"
blurb = "Если несколько пакетов компилируются одновременно, ABS может ограничить, сколько ядер процессора они используют вместе, чтобы компьютер оставался пригодным для другой работы."

[wizard.step.system_update]
title = "Обновление остальной системы"
blurb = "Это команды, которые ABS выполняет, когда вы просите обновить списки или обновить систему (например `abs -U`).\nВведите обычную команду; без конвейеров (|), && и лишних трюков оболочки."

[wizard.step.repositories]
title = "Откуда ABS скачивает рецепты сборки"
blurb = "Репозиторий здесь — git-сайт с рецептами сборки (инструкциями для компиляции пакета).\nМожно хранить несколько, добавить свои или удалить неиспользуемые.\nКогда вы вводите `abs mesa`, не называя репозиторий, ABS использует выбранный вами по умолчанию."

[wizard.step.ramdisk]
title = "Компилировать в ОЗУ? (необязательное ускорение)"
blurb = "RAM-диск — временный диск в оперативной памяти, а не на SSD. Компиляция там часто быстрее и меньше изнашивает диск,\nно нужны свободная ОЗУ и ваш пароль (sudo) для настройки. Папки из предыдущего шага остаются настоящими постоянными расположениями.\nRAM-диск создаётся только когда сборка в нём нуждается, а не при запуске ABS."

[wizard.step.self_update]
title = "Поддержание самого ABS в актуальном состоянии"
blurb = "ABS может проверять GitHub на более новую версию себя. Если вы устанавливаете через pacman, собранные пакеты попадают в папку готовых пакетов, чтобы другие компьютеры могли их использовать."

[wizard.step.package_lists]
title = "Списки пакетов (необязательно)"
blurb = "Можно оставить пустыми. Нажмите Enter, чтобы оставить текущий список (пустой в новой конфигурации).\nВведите имена через запятые или пробелы. Введите '-' чтобы очистить список.\nПозже их также можно изменить командой `abs --wizard` или в AbsGui."

[wizard.field.install_absgui]
title = "Нужен ли вам AbsGui (оконное приложение)?"
explanation = "AbsGui — окно с кнопками для тех же настроек, плюс обновления системы и дополнительные инструменты компиляции ядра.\n«Да» также сохраняет AbsGui, когда ABS обновляет сам себя. «Нет» оставляет только инструменты командной строки.\nЭто можно изменить позже."

[wizard.field.paths.packages_path]
title = "Где должны храниться скачанные исходные коды?"
explanation = "Перед компиляцией ABS скачивает исходные файлы каждого пакета в эту папку.\nПример: если вы собираете mesa, загрузка окажется здесь.\nГотовые установочные пакеты сохраняются в другую папку (следующий вопрос)."

[wizard.field.paths.chroot_base_path]
title = "Где должна жить изолированная среда сборки?"
explanation = "Если позже выберете «чистая мини-система», ABS компилирует во временной копии Linux, чтобы ваша настоящая установка осталась нетронутой.\nЭта папка нужна только для такого варианта. ABS всё равно спрашивает сейчас, чтобы настройка была готова."

[wizard.field.paths.ready_made_packages_path]
title = "Куда сохранять готовые пакеты?"
explanation = "После успешной компиляции ABS сохраняет здесь установочные файлы пакетов.\nЕсли несколько компьютеров используют эту папку совместно, компилировать нужно только одному; остальные могут устанавливать отсюда.\nНе используйте папку, куда pacman складывает свои скачанные пакеты."

[wizard.field.paths.chroot_makepkg_conf]
title = "Свой файл настроек компилятора для изолированных сборок? (необязательно)"
explanation = "Для опытных. Только если у вас уже есть особый файл настроек компилятора (часто называется makepkg.conf) для изолированных сборок.\nОставьте пустым, если такого файла нет. Нажмите Enter, чтобы оставить текущее значение, или введите '-' чтобы очистить."

[wizard.field.build.default_environment]
title = "Где должны компилироваться пакеты?"
explanation = "Это значение по умолчанию для каждого пакета. «На этом компьютере» проще и быстрее. «Чистая мини-система» более изолирована, но требует дополнительного места на диске."

[wizard.field.build.system_update_first]
title = "Обновлять систему перед компиляцией?"
explanation = "«Да» сначала выполняет обновление системы, затем компилирует. Так программы не ломаются, когда библиотека на диске не совпадает с только что собранной. Рекомендуется большинству."

[wizard.field.build.ignore_compilation_failures]
title = "Если один пакет не собрался, продолжать компилировать остальные?"
explanation = "«Да» продолжает оставшиеся пакеты. «Нет» останавливает весь запуск, чтобы сначала исправить ошибку. «Нет» безопаснее, если вы не уверены."

[wizard.field.build.compile_first_install_after]
title = "Сначала скомпилировать всё, потом устанавливать?"
explanation = "«Да» завершает все компиляции, затем предлагает установить. Удобно, если хотите оставить компьютер компилировать на ночь без вопросов. «Нет» может предлагать установку после каждого пакета."

[wizard.field.build.clean_install_by_default]
title = "Начинать каждую компиляцию с чистой папки?"
explanation = "«Да» удаляет оставшиеся временные папки сборки перед компиляцией, чтобы старые файлы не мешали новой сборке. Немного медленнее. «Нет» по возможности повторно использует эти папки."

[wizard.field.build.ignore_already_made_packages]
title = "Всегда перекомпилировать, даже если файл пакета уже есть?"
explanation = "«Нет» (рекомендуется) повторно использует готовый пакет той же версии и пропускает компиляцию. Выберите «Нет», если другие компьютеры должны использовать пакеты, собранные на этой машине.\n«Да» всегда компилирует заново. Один пакет всё равно можно принудительно пересобрать позже командой `abs -n`."

[wizard.field.build.concurrent_repos_downloads_limit]
title = "Сколько пакетов можно скачивать одновременно?"
explanation = "Большие числа быстрее завершают загрузки при хорошем интернете. Начните с предложения, если не уверены."

[wizard.field.build.concurrent_compilations_limit]
title = "Сколько пакетов можно компилировать одновременно?"
explanation = "1 безопаснее всего и использует меньше памяти. Увеличивайте только если много ядер процессора и достаточно ОЗУ. Компиляция нескольких крупных пакетов сразу может заморозить слабый компьютер."

[wizard.field.build.clean_chroot_after_compilation]
title = "Удалять временную мини-систему после изолированной компиляции?"
explanation = "«Да» освобождает место на диске после компиляции в чистой мини-системе. «Нет» сохраняет её, что может ускорить следующую изолированную компиляцию, но занимает больше диска."

[wizard.field.build.fast_aur_rpc_update_checks]
title = "Проверять обновления AUR одним запросом (быстрее)?"
explanation = "AUR — коллекция пакетов, которую добавляют пользователи Arch. «Да» один раз спрашивает сайт AUR сразу о многих пакетах вместо отдельной загрузки каждого. Быстрее и рекомендуется."

[wizard.field.build.global_cpu_threads_mode]
title = "Насколько строго ABS должен ограничивать использование процессора?"
explanation = "Это важно только когда одновременно компилируется больше одного пакета.\n«Никогда не превышать лимит» оставляет компьютер более отзывчивым. Другой вариант быстрее, но можно задать жёсткий максимум."

[wizard.field.build.default_compilation_threads]
title = "Сколько ядер процессора может использовать один пакет? (необязательно)"
explanation = "Сколько ядер процессора может использовать один пакет. Оставьте пустым, чтобы инструмент сборки решил сам. Введите '-' чтобы очистить сохранённое число."

[wizard.field.build.global_cpu_threads_cap]
title = "Максимум ядер процессора для всех компиляций вместе? (необязательно)"
explanation = "Ограничивает суммарное число ядер всех одновременных компиляций, чтобы остальной компьютер оставался пригодным к работе. Оставьте пустым, чтобы не добавлять лимит. Введите '-' чтобы очистить."

[wizard.field.build.maximum_cpu_threads_cap]
title = "Абсолютный максимум ядер процессора? (необязательно)"
explanation = "Используется только с мягким лимитом. Это жёсткий потолок, даже если ABS запускает дополнительные задания. Должен быть не ниже мягкого лимита. Введите '-' чтобы очистить."

[wizard.field.system_update.command_to_update_repositories]
title = "Какая команда обновляет список пакетов (ещё без обновлений)?"
explanation = "Это только скачивает свежий список доступных пакетов. Ничего не устанавливает и не обновляет. Обычно: sudo pacman -Sy"

[wizard.field.system_update.command_to_perform_system_update]
title = "Какая команда обновляет остальную систему?"
explanation = "Устанавливает доступные обновления. Обычно: sudo pacman -Syu. Если вы обычно используете yay или paru, укажите здесь эту команду."

[wizard.field.system_update.command_to_perform_system_update_no_refresh]
title = "Какую команду обновления использовать, когда список уже свежий? (необязательно)"
explanation = "То же обновление, что выше, но без обновления списка, потому что он только что был обновлён. Обычно: sudo pacman -Su. Введите '-' чтобы очистить."

[wizard.field.system_update.ignore_flag]
title = "Как программе обновления пропускать пакет?"
explanation = "Когда ABS обновляет остальную систему, она добавляет этот параметр и имена пакетов, чтобы ваши собственные собранные пакеты не заменились готовым обновлением. Для pacman, yay и paru это --ignore."

[wizard.field.repositories]
title = "Откуда ABS должен брать рецепты сборки?"
explanation = "Выберите, с каких git-сайтов ABS может скачивать рецепты сборки и какой использовать, когда вы не называете один."

[wizard.field.ramdisk.enabled]
title = "Использовать RAM-диск для компиляции?"
explanation = "«Да» может ускорить крупные компиляции (например ядра). «Нет» проще и не занимает дополнительную ОЗУ. Если не уверены, выберите «Нет»."

[wizard.field.ramdisk.mount_point]
title = "Где должен появляться RAM-диск?"
explanation = "Пример: /run/abs-ram. Последняя часть пути должна начинаться с «abs», чтобы ABS мог найти его безопасно."

[wizard.field.ramdisk.size]
title = "Сколько ОЗУ ему можно использовать?"
explanation = "Это максимум, а не заранее зарезервированный объём. Примеры: 16G или 50%. Не больше ОЗУ этого компьютера. Не используйте запятые."

[wizard.field.ramdisk.mode]
title = "Кто может пользоваться папкой RAM-диска?"
explanation = "Это код прав доступа. 0755 — обычное значение: вы можете читать и писать в папку; другие пользователи могут только читать. Оставьте предложение, если не уверены."

[wizard.field.ramdisk.build_workdir]
title = "Помещать тяжёлые папки компиляции в ОЗУ?"
explanation = "«Да» хранит временные файлы компиляции и кэши компилятора в ОЗУ. Хорошо для крупных пакетов вроде ядра. Нужна свободная память."

[wizard.field.ramdisk.chroot]
title = "Помещать всю изолированную мини-систему в ОЗУ?"
explanation = "«Да» может ускорить изолированные компиляции (чистая мини-система), но использует много ОЗУ. Только если вы компилируете так и памяти достаточно."

[wizard.field.ramdisk.packages]
title = "Помещать все скачанные исходники в ОЗУ?"
explanation = "«Да» копирует каждую скачанную папку исходников в ОЗУ. Использует много памяти — только если её с запасом."

[wizard.field.ramdisk.min_free_ram_mb]
title = "Сколько свободной ОЗУ (в МБ) нужно, прежде чем использовать RAM-диск?"
explanation = "Если у компьютера меньше свободной памяти, чем это значение (в мегабайтах), ABS не будет использовать RAM-диск. Так машина реже зависает. 4096 означает 4 ГБ."

[wizard.field.check_for_update_on_startup]
title = "Сообщать, когда доступна более новая версия ABS?"
explanation = "«Да» проверяет в фоне при запуске abs и напоминает в конце работы, если есть обновление. Само ничего не устанавливает."

[wizard.field.auto_update_on_startup]
title = "Обновлять ABS автоматически при запуске?"
explanation = "«Да» устанавливает более новый ABS до всего остального. Это может занять время. «Нет» только уведомляет (если включили предыдущий вопрос)."

[wizard.field.self_update_use_pacman]
title = "Устанавливать обновления ABS через pacman?"
explanation = "«Да» — обычный способ Arch: собрать пакеты и установить их через pacman. Файлы попадают в папку готовых пакетов.\n«Нет» копирует программы abs (и AbsGui) в папку, которую вы выберете далее."

[wizard.field.self_update_install_path]
title = "Куда копировать программу abs?"
explanation = "AbsGui помещается в ту же папку. Обычно: /usr/bin/abs"

[wizard.field.self_update_at_updates]
title = "Также проверять более новую версию ABS во время обновления системы?"
explanation = "«Да» ищет более новый ABS, когда вы запускаете обновление системы (`abs -U`). «Нет» проверяет только при запуске (если вы это включили)."

[wizard.field.manual_update_packages]
title = "Какие пакеты ABS должен отслеживать и пересобирать, когда появится новее?"
explanation = "ABS проверяет эти пакеты в их репозитории и может компилировать их автоматически, когда появляется новая версия. Пример: mesa. Оставьте пустым, если пока не уверены."

[wizard.field.skip_install_packages]
title = "Какие пакеты не устанавливать из официальных репозиториев?"
explanation = "Если вы планируете собрать пакет сами, обычно не хотите, чтобы pacman поставил поверх готовую версию. Пример: qemu*. Шаблоны с * работают."

[wizard.field.skip_install_packages_after_compilation]
title = "Какие пакеты не устанавливать после того, как вы их скомпилировали? (необязательно)"
explanation = "После компиляции ABS может предложить установить результат. Имена из этого списка пропускаются, что ускоряет этот шаг.\nПример: qemu-docs, если вы скомпилировали qemu, но не хотите пакет документации.\nНажмите Enter, чтобы оставить текущее значение. Введите '-' для пустого списка. В новом файле Enter оставляет это незаданным (как список выше)."

[wizard.field.system_update.ignore_packages]
title = "Ещё какие-то пакеты пропускать во время обновления системы?"
explanation = "Эти имена добавляются к списку пропуска, когда ABS выполняет команду обновления системы, сверх списков выше. Оставьте пустым, если другие списки уже покрывают то, что вы собираете сами."

[wizard.choice.env.local]
label = "На этом компьютере (проще и быстрее)"
help = "Использует компиляторы и библиотеки, уже установленные здесь. Этого хочет большинство."

[wizard.choice.env.chroot]
label = "В чистой мини-системе (более изолированно)"
help = "Сборка не подхватит лишние пакеты из вашей настоящей установки.\nНужно больше места на диске и пакет Arch с именем `devtools`."

[wizard.choice.cpu.strict]
label = "Никогда не превышать лимит"
help = "Если другая компиляция использовала бы слишком много ядер процессора, ABS ждёт. Компьютер остаётся более отзывчивым."

[wizard.choice.cpu.flexible]
label = "Мягкий лимит с необязательным жёстким максимумом"
help = "ABS старается не выходить за мягкий лимит, но может немного превысить его вплоть до жёсткого максимума, который можно задать."

