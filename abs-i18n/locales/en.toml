held_check = "Compare held and trigger versions to currently installed packages (runs abs --hold-check)."
ramdisk_enabled = "Master switch for tmpfs mounts configured below and per-package ramdisk targets."
ramdisk_mount = "Filesystem path where the tmpfs ramdisk is mounted."
ramdisk_size = "Tmpfs size limit (e.g. 16G or 50% of RAM). Must not exceed installed RAM. Passed to mount -o size=."
ramdisk_mode = "Directory permissions mode for the mount point (octal)."
ramdisk_global_w = "Default: put build workdirs (src/, pkg/) on tmpfs for packages that use ramdisk w. Also redirects ccache/TMPDIR and similar caches onto the ramdisk."
ramdisk_global_c = "Default: put chroot rootfs on tmpfs for packages that use ramdisk c."
ramdisk_global_p = "Default: clone sources under packages_path on tmpfs for packages that use ramdisk p."
ramdisk_seed = "Optional existing chroot directory copied to seed a fresh ramdisk chroot."
