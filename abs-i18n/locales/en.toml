package_zram = "Per-package zram: inherit uses [ramdisk] zram; off or full overrides for this package's compile. System update always uses the global setting."
ramdisk_warn_packages = "Warn when packages_path on tmpfs may exceed available RAM."
ramdisk_reclaim = "Unmount an existing mount at mount_point before mounting (recover from crashed runs)."
repo_url = "Pacman repository URL for this named repo."
compiler_cc = "C compiler executable for this named compiler set."
compiler_cxx = "C++ compiler executable for this named compiler set."
terminal_colors = "Palette for the log viewport in the current window theme. Switch Dark or Light above to edit the other. Match app theme follows the window; a named palette stays on this Dark or Light slot."
