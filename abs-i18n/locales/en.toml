[gui.help]
cpusched = "Kernel scheduler flavour passed as _cpusched to the CachyOS PKGBUILD (e.g. bore, eevdf, rt)."
processor_opt = "CPU micro-architecture level for -march (native or x86-64-v2/v3/v4). Maps to _processor_opt."
llvm_lto = "Compiler/LTO (_use_llvm_lto): none = GCC build, thin/full = Clang with LTO. Applies to one-shot builds; PGO runs force their own per-stage value."
hz_ticks = "Timer interrupt frequency in Hz (_HZ_ticks). Affects latency vs power."
tickrate = "Tickless behaviour: full (always tickless), idle, or periodic. Maps to _tickrate."
preempt = "Kernel preemption model (full, voluntary, server, lazy). Maps to _preempt."
hugepage = "Transparent hugepage policy: always or madvise. Maps to _hugepage."
cc_harder = "Enable KBUILD_CFLAGS -O3 via _cc_harder. CachyOS default is on. Uncheck to keep -O2."
lto_suffix = "Append -lto to the package name (_use_lto_suffix). One-shot builds only. PGO keeps the starting package name (linux-cachyos stays linux-cachyos even with ThinLTO) unless you started PGO on an -lto package."
gcc_suffix = "Append -gcc to the package name when building with GCC (_use_gcc_suffix)."
kcfi = "Enable kernel Control Flow Integrity (_use_kcfi). Requires a Clang/LLVM build."
source = "PKGBUILD source repository from [repositories]: aur, arch, cachyos, or any custom repo name."
build_env = "Build environment: local (host makepkg) or chroot (isolated rootfs)."
package_alias = "Alternate upstream package name checked for updates (e.g. the repo package this AUR package tracks)."
package_compiler = "Named compiler set from [compilers] used for this package; empty = default_compiler / makepkg default."
package_tests = "Run the PKGBUILD check() phase. Default follows makepkg; false passes --nocheck."
package_upstream_github = "GitHub owner/repo (or URL) checked on -R/-RU when the PKGBUILD lags behind upstream releases."
package_upstream_prereleases = "Also consider GitHub prereleases when choosing the newest upstream version."
package_pre_update_cmd = "Shell command run before this package is built (e.g. stop a service)."
package_post_update_cmd = "Shell command run after this package is installed (e.g. restart a service)."
package_custom_local_cmd = "Replaces the makepkg invocation for local builds. Runs in the package directory; empty = default makepkg."
package_custom_chroot_cmd = "Replaces the makechrootpkg invocation for chroot builds. Runs in the package directory; empty = default."
ramdisk_targets = "Place parts of the build on tmpfs (ramdisk). Letters combine into the ramdisk= value in abs.toml."
ramdisk_w = "Build workdir (src/, pkg/) on tmpfs — speeds compile I/O for large trees like the kernel."
ramdisk_c = "Chroot root filesystem on tmpfs — faster package installs inside chroot."
ramdisk_p = "Git clone / extract under packages_path on tmpfs. Uses a lot of RAM; enable only if you have spare memory."
ramdisk_r = "PGO profile collection scratch (perf.data) on tmpfs; profiles are still copied to profiles_archive_dir after each stage."
kernel_ramdisk_targets = "Kernel/PGO ramdisk options. PKGBUILD and source tarballs stay on disk unless repo-on-ramdisk (p) is enabled."
kernel_ramdisk_w = "Compile on ramdisk: git repo and downloads stay on disk; src/ and pkg/ (extracted tree) use tmpfs. Also redirects ccache, TMPDIR, and other build caches to the ramdisk."
kernel_ramdisk_p = "Repo on ramdisk: clone the full git tree on tmpfs (re-downloads on each PGO stage — not recommended)."
kernel_ramdisk_r = "Write perf.data to tmpfs during profiling. Comparison logs stay on disk under profiles_archive_dir."
kernel_ramdisk_hint = "Recommended: w + r only (compile and profile scratch on tmpfs; git repo and kernel tarballs stay on disk). Stage 1 runs updpkgsums once before copying to ramdisk."
pgo_benchmark_workdir = "Optional working directory for comparison logs and CachyOS-benchmarker downloads. Default: {profiles_archive_dir}/benchmark-workdir."
pgo_enabled = "Run the multi-stage AutoFDO + Propeller pipeline instead of a single build when using abs --pgo."
pgo_archive_dir = "Required. Directory where PGO profile archives and intermediate artifacts are stored between stages and reboots."
pgo_save_kernels_dir = "Optional. Copy each stage's kernel packages (same filenames) to {save_kernels_dir}/{YYYY-MM-DD}/{debug|autofdo|final}/. Empty = do not copy. Stages overwrite PKGDEST, so this keeps the debug, AutoFDO, and Propeller packages."
pgo_benchmark = "Optional. Override the default ABS profiling script. Leave empty to use the bundled script (refreshed on each run)."
pgo_benchmark_preset = "Training is always the kernel workload (syscall, scheduler, VFS, network). Userspace suites are not used for AutoFDO collection."
pgo_compare_preset = "Scoring workload for no-perf comparison charts. kbench (default) is a few minutes of kernel-path metrics. cachyos runs the full CachyOS-benchmarker suite (~30–60 min, first run downloads; needs cachyos-benchmarker on PATH). kbench+cachyos runs CachyOS first and appends kbench to the same log. Never used under perf record. profiling_quality only shortens kbench, not CachyOS."
pgo_profiling_quality = "short = ~10 min train / ~3 min kbench. sweet (default) = ~20 min train / ~6 min kbench. long = ~60 min train / ~10 min kbench. Trains on kernel paths. Does not shorten a CachyOS compare suite. Aliases: standard→sweet, maximum→long."
pgo_build_user = "Unix user that runs profiling workloads after reboot (must match the user in your benchmark script)."
pgo_sysctl = "Command invoked before profiling to tune sysctl knobs (e.g. cachyos-perf-sysctl)."
pgo_auto_restart = "abs reboots at each PGO wait stage and resumes after boot via a user systemd unit until the pipeline finishes. Enabling auto-restart installs a narrow /etc/sudoers.d drop-in so resume can mount the ramdisk, install the kernel, profile, and reboot without a password; that file is removed when the pipeline finishes or you abort. Resume still opens a terminal so you can watch the run (or a console/SSH TTY when there is no desktop). Same-boot profile → build stays in the current terminal. absgui passes --pgo-auto. Linger is enabled when possible so the wait can start before you log in."
pgo_compare_current = "Clean comparison run (no perf record) of the kernel already booted, before the debug PGO build. Always drops page cache, dentries, and inodes, then a short CPU-only warm-up. Workload is compare_preset (kbench, cachyos, or both). Logs and comparison charts go to profiles_archive_dir/compare-benchmarks."
pgo_compare_debug = "Kept for old configs. Profiling logs join the with-overhead charts whenever any comparison bench is enabled."
pgo_compare_debug_clean = "Clean comparison run of the debug kernel (no perf). Always drops page cache, dentries, and inodes and runs a short CPU-only warm-up first, even right after AutoFDO collection on this kernel. Profiling still feeds the with-overhead charts."
pgo_compare_autofdo = "Kept for old configs. Profiling logs join the with-overhead charts whenever any comparison bench is enabled."
pgo_compare_autofdo_clean = "Clean comparison run of the AutoFDO kernel (no perf). Always drops page cache, dentries, and inodes and runs a short CPU-only warm-up first, even right after Propeller collection on this kernel. Profiling still feeds the with-overhead charts."
pgo_compare_final = "Clean comparison run (no perf record) of the final Propeller kernel after the last reboot, then regenerate comparison charts against the other selected kernels. Always drops page cache, dentries, and inodes, then a short CPU-only warm-up."
pgo_reboot_before_start = "Reboot into the kernel already installed before the first comparison, so the current-kernel score uses the same cold-boot setup as later stages."
pgo_shutdown_after_finish = "When the PGO pipeline finishes successfully, power off the machine after a short delay. Abort does not shut down. With auto-restart, the same passwordless sudo helper is used; that drop-in is removed before poweroff."
pgo_reuse_afdo_profile = "If a suitable AutoFDO profile is already in the archive, skip AutoFDO collection. A debug no-perf bench still builds and boots the debug kernel. Without that bench the debug build is skipped."
pgo_reuse_propeller_profile = "If suitable Propeller profiles are already in the archive, skip Propeller collection. An AutoFDO no-perf bench still builds and boots the AutoFDO kernel. Without that bench the AutoFDO build is skipped."
pgo_skip_propeller = "Stop after the AutoFDO kernel. Skip Propeller collection and the Propeller compile (one less reboot and one less kernel build). That AutoFDO kernel is built without Propeller instrumentation, so it is the kernel you keep. If compare_final is on, it scores this AutoFDO kernel after the last reboot."
pgo_preset = "PGO pipeline preset name (usually cachyos-kernel). Reserved for future pipeline variants."
pgo_profile_scratch = "Directory for perf.data during profiling. auto = ramdisk when enabled, else a temp path under /tmp or the archive dir."
pgo_perf_data_on_ram = "Write perf.data to tmpfs (ramdisk profile scratch) during profiling; copies to the repo/archive after each stage."
pgo_propeller_profiles_on_ram = "Keep stage-3 propeller.data and converted propeller_cc/ld profiles on ramdisk scratch. Skip copying them to profiles_archive_dir. The final Propeller kernel build runs in the same boot, so a HDD archive is not required. Uncheck to also save a persistent copy."
pgo_convert_relocate = "Before AutoFDO/Propeller convert, move the raw capture off tmpfs so the converter's working set does not sit on top of the file in RAM. force (default) always relocates. smart keeps the file on ramdisk only when MemAvailable covers a pessimistic convert peak (6× file for Propeller, 2× for llvm-profgen) plus ramdisk.min_free_ram_mb; otherwise same as force. The copy goes to {profiles_archive_dir}/pgo-convert/<package>/, not the package repo, and is deleted after convert succeeds."
pgo_verify_boot = "After reboot wait stages, verify uname -r matches the expected kernel before continuing the pipeline."
pgo_select_boot_kernel = "Before each PGO reboot, set a one-shot bootloader entry for the kernel this stage installed (systemd-boot and Limine via bootctl set-oneshot, GRUB via grub-reboot). Does not change the permanent default. If this fails and auto-restart is on, abs stops instead of rebooting into the wrong kernel."
pgo_perf_event_args = "perf record event arguments. auto = detect Zen (--pfm-events) or Intel (BR_INST_RETIRED.NEAR_TAKEN) branch events from gcc -march=native."
pgo_perf_extra_args = "perf record flags after events (mmap-pages, -a, -N, -b). mmap-pages is per CPU under -a (4096 = 16MiB×NCPU). The old 131072 (512MiB×NCPU) fails the probe with mmap ENOMEM and is remapped. profiling_quality always sets -c unless this field already contains -c/--count or -F/--freq. Omitting a period makes perf use -F 4000, which OOMs a long LBR capture on ramdisk. Older -c 48000 / 56000 configs still follow profiling_quality."
pgo_vmlinux = "Path to DWARF vmlinux for llvm-profgen. auto = /usr/src/debug/<pkgbase>/vmlinux from the installed -dbg package."
pgo_afdo_tool = "Profile conversion tool for stage 2 (default llvm-profgen)."
pgo_propeller_tool = "Profile conversion tool for stage 3. auto (default) uses generate_propeller_profiles from PATH or the ABS cache, otherwise create_llvm_prof. LLVM 22+ kernels (BB_ADDR_MAP v5) need generate_propeller_profiles; ABS builds it from google/llvm-propeller against system LLVM when it is missing. create_llvm_prof 0.30 cannot read BB_ADDR_MAP v5."
pgo_afdo_profile_name = "Filename of the AutoFDO profile copied into the kernel source tree (default kernel-compilation.afdo)."
pgo_state_file = "Optional override for PGO pipeline JSON state. Default: ~/.config/abs/pgo/<package>.json"
path_packages = "Directory where ABS stores cloned sources (git trees). Sharing this across machines is optional."
path_chroot = "Base directory for chroot build roots (one subfolder per environment)."
path_ready = "Directory for finished .pkg.tar.* files (PKGDEST). Share this folder so other PCs skip compiles, including abs --self-update. Do not use pacman's CacheDir here."
path_chroot_makepkg = "Optional makepkg.conf copied into chroots; leave empty to use the chroot default."
default_env = "Default build environment when a package does not set build_env."
default_compiler = "Default compiler set name from [compilers]; leave empty to use makepkg defaults."
concurrent_repos = "Maximum parallel repository/package downloads."
concurrent_compilations = "Maximum parallel compile jobs across packages."
system_update_first = "Run a system update before starting a build batch (-R / -RU)."
ignore_failures = "Continue building other packages if one package fails to compile."
compile_first_install = "After a successful compile, install the package before moving to dependents."
clean_install_default = "Default for clean install (-C) when not specified on the command line."
ignore_already_made = "Always rebuild even when a ready package at the PKGBUILD version (or newer) already exists. When off, skip compilation and reuse those artifacts (unless -n). Keep off so other computers sharing ready_made_packages_path skip compiles. Stale older ready packages do not skip a rebuild."
fast_aur_rpc = "Use fast AUR RPC checks for update detection (fewer requests, may miss edge cases)."
clean_chroot_after = "Remove chroot build artifacts after each successful chroot compilation."
global_cpu_threads_mode = "CPU thread cap mode: strict (hard cap) or flexible (soft cap with optional burst ceiling)."
global_cpu_threads_cap = "Max sum of active compilation threads across concurrent builds (strict hard cap; flexible soft target)."
maximum_cpu_threads_cap = "Flexible mode only: hard ceiling when pairing exceeds the soft cap."
default_compilation_threads = "Default -j for packages without per-package compilation_threads (overridable with abs -j)."
package_compilation_threads = "Per-package -j thread count (sacred; scheduler never reduces it)."
package_compile_alone = "When true, this package runs with no other package compiling at the same time."
package_compilation_priority = "Higher value schedules this package earlier among ready builds."
check_update_startup = "Check for a new ABS release when abs starts."
auto_update_startup = "Automatically install a new ABS release on startup when found."
self_update_at_updates = "Also check for ABS updates when running repository update commands."
install_testing = "Allow installing Arch testing/staging packages when resolving dependencies."
self_update_install = "Fallback path for the abs binary when not using pacman packages (legacy manual install)."
self_update_use_pacman = "When true (default), --self-update builds aur/PKGBUILD into ready_made_packages_path and upgrades pacman packages. Other machines that share that folder install those files instead of compiling. When false, copies abs and absgui binaries (and desktop/icon under /usr)."
install_absgui = "When true (default), --self-update also installs AbsGui (binary, desktop entry, and icon)."
manual_update = "Packages always rebuilt on -R/-RU even when ABS thinks they are up to date."
skip_install = "Packages compiled but not installed to the live system. Supports globs such as qemu*."
skip_install_after = "Separate skip-install list used only after compilation in a batch run. Supports globs such as qemu*."
use_separate_skip_after = "Maintain a distinct skip_install_packages_after_compilation list in abs.toml."
sys_repos_cmd = "Shell command to refresh package databases (e.g. pacman -Sy)."
sys_full_cmd = "Shell command for a full system upgrade (e.g. pacman -Syu)."
sys_no_refresh_cmd = "Upgrade without refreshing databases; derived from full command if empty."
sys_auto_refresh_delay = "Minutes between automatic pending-update refreshes. 0 = only when you press Refresh. First visit still loads the list."
sys_remember_sudo = "When enabled, AbsGui stores your sudo password in a private runtime file until you quit. When disabled, each privileged command asks again."
sys_ignore_flag = "Flag passed to pacman to skip specific packages during upgrade."
sys_ignore_packages = "Package names excluded from system upgrades (paired with ignore_flag). Supports globs such as qemu*."
held_packages = "Packages pinned to a fixed pkgver-pkgrel. Ignored during system update and not version-compared on -R/-RU. Rebuild with abs <pkg> or when on_packages_updated triggers drift (checked on -U)."
held_name = "Package name to hold."
held_version = "Pinned version as pkgver-pkgrel (epoch allowed in pkgver, e.g. 1:0.56.1-1)."
