[package]
name = "absgui"
version.workspace = true
edition = "2021"
license = "CC-BY-4.0"
description = "GUI for ABS — Arch/CachyOS package builder"
build = "build.rs"

[[bin]]
name = "absgui"
path = "src/main.rs"

[dependencies]
dirs = "6.0.0"
libc = "0.2"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
iced = { version = "0.14.0", features = ["tokio", "image", "advanced"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
abs-i18n = { path = "../abs-i18n" }
