[workspace]
members = [".", "absgui", "abs-i18n"]
default-members = [".", "absgui"]
resolver = "2"

[workspace.package]
version = "2.1.1"

[package]
name = "abs"
# Literal `version =` (not `version.workspace`) so installed abs --self-update
# clients that only parse `[package]` can still read this file from GitHub.
version = "2.1.1"
edition = "2024"
license = "CC-BY-4.0"

[[bin]]
name = "abs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
colored = "3.1.1"
dirs = "6.0.0"
libc = "0.2"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
toml_edit = "0.25"
abs-i18n = { path = "abs-i18n" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Fast local builds for smoke-testing (optimized, no LTO). Artifacts: target/fast/
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

