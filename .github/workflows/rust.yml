name: Release Arch packages
on:
  push:
    branches: [main]   # use your default branch
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # For CachyOS repos/tooling, generic image instead:
      # image: cachyos/cachyos
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed git sudo github-cli
          id builder >/dev/null 2>&1 || useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
      - uses: actions/checkout@v7
      - name: Build packages
        working-directory: aur
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder makepkg -s --noconfirm --noprogressbar
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          shopt -s nullglob
          mapfile -t pkgs < <(find aur -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*')
          [[ ${#pkgs[@]} -gt 0 ]] || { echo "no packages built"; exit 1; }
          ver=$(grep -E '^version = "' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          names=()
          for pkg in abs absgui abs-full; do
            for p in "${pkgs[@]}"; do
              b=$(basename "$p")
              if [[ "$b" == "${pkg}-${ver}-"* ]]; then
                names+=("$b")
                break
              fi
            done
          done
          [[ ${#names[@]} -eq 3 ]] || { echo "expected abs, absgui, and abs-full packages, got: ${names[*]}"; exit 1; }
          commit_msg=$(git log -1 --format=%s)
          notes="$(printf 'ABS ver. %s\n%s\n\n```\nsudo pacman -U %s %s %s\n```\n' "$ver" "$commit_msg" "${names[0]}" "${names[1]}" "${names[2]}")"
          tag="v${ver}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${pkgs[@]}"
            gh release edit "$tag" --title "ABS ${ver}" --notes "$notes" --latest
          else
            gh release create "$tag" "${pkgs[@]}" --title "ABS ${ver}" --notes "$notes" --latest
          fi
