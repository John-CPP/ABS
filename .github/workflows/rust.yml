name: Release Arch packages
on:
  push:
    branches: [main]   # use your default branch
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # For CachyOS repos/tooling, generic image instead:
      # image: cachyos/cachyos
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed git sudo github-cli
          id builder >/dev/null 2>&1 || useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
      - uses: actions/checkout@v7
      - name: Build packages
        working-directory: aur
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder makepkg -s --noconfirm --noprogressbar
      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mapfile -t pkgs < <(find aur -maxdepth 1 -name '*.pkg.tar.zst' ! -name '*-debug-*')
          [[ ${#pkgs[@]} -gt 0 ]] || { echo "no packages built"; exit 1; }
          ver=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          notes="Built from ${{ github.sha }} (pkgver ${ver}). Install with: sudo pacman -U abs-*.pkg.tar.zst absgui-*.pkg.tar.zst abs-full-*.pkg.tar.zst"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest --clobber "${pkgs[@]}"
            gh release edit latest --title "ABS ${ver}" --notes "$notes"
          else
            gh release create latest "${pkgs[@]}" --title "ABS ${ver}" --notes "$notes" --latest
          fi
